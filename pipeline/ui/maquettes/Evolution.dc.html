<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Évolution, après</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&amp;family=Barlow+Semi+Condensed:wght@500;600&amp;family=Barlow+Condensed:wght@500;600&amp;display=swap">
<style>
body{margin:0}
a{color:inherit}a:hover{color:inherit}
.kx{display:block;background:currentColor;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center;-webkit-mask-size:contain;mask-size:contain}
.k-chart{-webkit-mask-image:url(/_blob/b42e40b31ee970889d5b589d96960063);mask-image:url(/_blob/b42e40b31ee970889d5b589d96960063)}
</style>
</helmet>
<div style="{{vars}} width: 390px; height: 844px; position: relative; overflow: hidden; background: var(--fond); color: var(--texte); font-family: 'Barlow', sans-serif; font-size: 15px; line-height: 22px; box-sizing: border-box">
  <div style="padding: 8px 20px 24px; display: flex; flex-direction: column; gap: 12px">

    <header style="display: grid; grid-template-columns: 44px 1fr; align-items: center; min-height: 64px">
      <a href="Programme.dc.html" aria-label="Retour" style="width: 44px; height: 44px; display: flex; align-items: center">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--texte)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
      </a>
      <h1 style="margin: 0; font-family: 'Barlow Semi Condensed', sans-serif; font-weight: 600; font-size: 22px; line-height: 28px; text-transform: {{tt}}; letter-spacing: {{ls}}">Évolution</h1>
    </header>

    <section style="background: var(--surface); border-radius: 24px; padding: 18px; display: flex; flex-direction: column; gap: 14px">
      <h2 style="margin: 0; font-family: 'Barlow Semi Condensed', sans-serif; font-weight: 600; font-size: 18px; line-height: 24px">Quand je vois qu'un changement t'aiderait</h2>
      <div role="radiogroup" aria-label="Mode d'évolution" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 18px; background: var(--haute)">
        <sc-for list="{{modes}}" as="m" hint-placeholder-count="2">
          <button role="radio" aria-checked="{{m.on}}" onClick="{{m.pick}}" style="{{m.style}}">{{m.label}}</button>
        </sc-for>
      </div>
      <p style="margin: 0">{{explain}}</p>
    </section>

    <section style="background: var(--surface); border-radius: 24px; padding: 18px; display: flex; flex-direction: column; gap: 14px">
      <div style="display: grid; grid-template-columns: 64px 1fr; gap: 14px; align-items: center">
        <span class="kx k-chart" aria-hidden="true" style="width: 64px; height: 54px; color: var(--texte)"></span>
        <p style="margin: 0">Dans 2 semaines de séances, je pourrai ajuster ton volume et alléger une semaine.</p>
      </div>
      <div style="display: flex; flex-direction: column">
        <sc-for list="{{steps}}" as="s" hint-placeholder-count="4">
          <div style="display: grid; grid-template-columns: 24px 1fr; gap: 12px; padding: 10px 0; border-top: 1px solid var(--filet)">
            <sc-if value="{{s.done}}" hint-placeholder-val="{{false}}">
              <svg width="22" height="22" viewBox="0 0 24 24" role="img" aria-label="Disponible"><circle cx="12" cy="12" r="10" fill="#5CB860"/><path d="M7.5 12.5l3 3 6-6.5" fill="none" stroke="var(--fond)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </sc-if>
            <sc-if value="{{s.locked}}" hint-placeholder-val="{{true}}">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--texte3)" stroke-width="2" stroke-linecap="round" role="img" aria-label="Pas encore"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
            </sc-if>
            <div style="display: flex; flex-direction: column">
              <span style="{{s.titleStyle}}">{{s.title}}</span>
              <span style="color: var(--texte2); font-size: 13px; line-height: 18px">{{s.when}}</span>
            </div>
          </div>
        </sc-for>
      </div>
    </section>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"palette":{"editor":"enum","options":["bordeaux","obsidian","arctic","neon","titanium","violet","forest","solar"],"default":"bordeaux"},"capitales":{"editor":"boolean","default":true},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { mode: 'Libre' }; }
  renderVals() {
    var T = {
      bordeaux: {fond: '#181819', surface: '#222223', haute: '#2D2C2E', filet: '#383738', texte: '#F3F0F1', texte2: '#ABABAF', texte3: '#77777A', pleine: '#873B38', surPleine: '#FFFFFF', encre: '#CA6F6A', second: '#B24B49', accent: '#D9A66C'},
      obsidian: {fond: '#121316', surface: '#1C1D20', haute: '#27272B', filet: '#313235', texte: '#F3F0F1', texte2: '#ABABAF', texte3: '#77777A', pleine: '#D73E44', surPleine: '#FFFFFF', encre: '#EA4C50', second: '#FF8566', accent: '#FFC857'},
      arctic: {fond: '#152238', surface: '#242D3D', haute: '#2F3748', filet: '#3A4354', texte: '#F3F0F1', texte2: '#ABABAF', texte3: '#77777A', pleine: '#2563EB', surPleine: '#FFFFFF', encre: '#668EFF', second: '#4F9CF9', accent: '#14B8A6'},
      neon: {fond: '#101510', surface: '#1A1F1A', haute: '#242A24', filet: '#2F342E', texte: '#F2F0ED', texte2: '#AAACA7', texte3: '#757873', pleine: '#B4F044', surPleine: '#111111', encre: '#B4F044', second: '#67D8C0', accent: '#8C72FF'},
      titanium: {fond: '#171E24', surface: '#21282F', haute: '#2C3339', filet: '#373E45', texte: '#F2F0F1', texte2: '#AAABAE', texte3: '#76777A', pleine: '#4C6474', surPleine: '#FFFFFF', encre: '#7992A3', second: '#8A9DA8', accent: '#D5A24C'},
      violet: {fond: '#181427', surface: '#221E31', haute: '#2D293C', filet: '#383347', texte: '#F4EFF1', texte2: '#AEAAAF', texte3: '#79767A', pleine: '#7546DB', surPleine: '#FFFFFF', encre: '#986CFF', second: '#AC8CFA', accent: '#29BFB0'},
      forest: {fond: '#17251D', surface: '#213027', haute: '#2C3B32', filet: '#37463D', texte: '#F2F0EE', texte2: '#A9ACA8', texte3: '#757874', pleine: '#236B50', surPleine: '#FFFFFF', encre: '#5CA283', second: '#7BAC81', accent: '#D7B374'},
      solar: {fond: '#211B1A', surface: '#2C2524', haute: '#37302F', filet: '#423B39', texte: '#F7EFED', texte2: '#B4A9A7', texte3: '#7F7573', pleine: '#CA4F1C', surPleine: '#FFFFFF', encre: '#E86531', second: '#FF9760', accent: '#E8BC49'}
    };
    var a = T[this.props.palette] || T.bordeaux;
    var caps = this.props.capitales !== false;
    var vars = '--fond: ' + a.fond + '; --surface: ' + a.surface + '; --haute: ' + a.haute + '; --filet: ' + a.filet + '; --texte: ' + a.texte + '; --texte2: ' + a.texte2 + '; --texte3: ' + a.texte3 + ';';
    var self = this;
    var base = 'all: unset; cursor: pointer; box-sizing: border-box; height: 44px; text-align: center; font-weight: 600; ';
    var modes = ['Assisté', 'Libre'].map(function (l) {
      var on = self.state.mode === l;
      return {
        label: l, on: on ? 'true' : 'false',
        style: base + (on ? 'border-radius: 22px; background: ' + a.pleine + '; color: ' + a.surPleine + ';' : 'border-radius: 14px; color: var(--texte2);'),
        pick: function () { self.setState({ mode: l }); }
      };
    });
    var explain = this.state.mode === 'Libre'
      ? 'Je te propose, tu décides : accepter, refuser ou plus tard. Rien ne change sans ton accord.'
      : 'J’applique le changement et je te l’explique ; tu peux l’annuler.';
    var raw = [
      ['Régler tes charges et tes répétitions', 'Dès la première séance', true],
      ['Ajuster ton volume et alléger une semaine', 'Après 2 semaines de séances', false],
      ['Échanger un exercice qui stagne', 'Après 4 semaines', false],
      ['Réorganiser une séance', 'Après un bloc terminé', false]
    ];
    var steps = raw.map(function (r) {
      return { title: r[0], when: r[1], done: r[2], locked: !r[2], titleStyle: r[2] ? 'font-weight: 600' : 'color: var(--texte2)' };
    });
    return { a: a, vars: vars, tt: caps ? 'uppercase' : 'none', ls: caps ? '.3px' : '0', modes: modes, explain: explain, steps: steps };
  }
}
</script>
</body>
</html>
