<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Bilan du jour, après</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&amp;family=Barlow+Semi+Condensed:wght@500;600&amp;family=Barlow+Condensed:wght@500;600&amp;display=swap">
<style>
body{margin:0}
a{color:inherit}a:hover{color:inherit}
.kx{display:block;background:currentColor;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center;-webkit-mask-size:contain;mask-size:contain}
.k-board{-webkit-mask-image:url(/_blob/f20d304f4772ae147a55e6fa3cefe2d7);mask-image:url(/_blob/f20d304f4772ae147a55e6fa3cefe2d7)}
.k-check{-webkit-mask-image:url(/_blob/291b12265996ee1899e3f5e4726a8faa);mask-image:url(/_blob/291b12265996ee1899e3f5e4726a8faa)}
.k-oops{-webkit-mask-image:url(/_blob/10a96bf704a95883be238c266ed9d595);mask-image:url(/_blob/10a96bf704a95883be238c266ed9d595)}
.k-shrug{-webkit-mask-image:url(/_blob/800f12689cddc4efee0e91f0fefe8232);mask-image:url(/_blob/800f12689cddc4efee0e91f0fefe8232)}
.k-ponder{-webkit-mask-image:url(/_blob/b6f4d944ad7b488eaceeaabc303b0617);mask-image:url(/_blob/b6f4d944ad7b488eaceeaabc303b0617)}
.k-thumbs{-webkit-mask-image:url(/_blob/07b89e486a85743f01575de2ab4e91cb);mask-image:url(/_blob/07b89e486a85743f01575de2ab4e91cb)}
.k-cheer{-webkit-mask-image:url(/_blob/574bb13d0064b5cb3140072917b38fd5);mask-image:url(/_blob/574bb13d0064b5cb3140072917b38fd5)}
</style>
</helmet>
<div style="{{vars}} width: 390px; height: 844px; position: relative; overflow: hidden; background: var(--fond); color: var(--texte); font-family: 'Barlow', sans-serif; font-size: 15px; line-height: 22px; box-sizing: border-box">
  <div style="padding: 8px 20px 24px; display: flex; flex-direction: column; gap: 16px">

    <header style="display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; min-height: 64px">
      <a href="Main.dc.html" aria-label="Retour" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: flex-start">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--texte)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
      </a>
      <div style="display: flex; flex-direction: column; min-width: 0">
        <h1 style="margin: 0; font-family: 'Barlow Semi Condensed', sans-serif; font-weight: 600; font-size: 20px; line-height: 24px; text-transform: {{tt}}; letter-spacing: {{ls}}">Squat + gainage</h1>
        <span style="color: var(--texte2); font-size: 13px; line-height: 18px">S13, J3</span>
      </div>
      <button aria-label="Plus d'actions" style="all: unset; cursor: pointer; width: 44px; height: 44px; display: flex; align-items: center; justify-content: flex-end">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="var(--texte)" aria-hidden="true"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>
      </button>
    </header>

    <div style="display: flex; flex-direction: column; gap: 12px">
      <div style="display: flex; align-items: center; justify-content: space-between">
        <span style="color: var(--texte2); font-size: 14px">Bilan du jour</span>
        <a href="Seance.dc.html" style="display: flex; align-items: center; gap: 8px; height: 44px; color: {{a.encre}}; text-decoration: none; font-weight: 600">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 9h8M8 13h8M8 17h5"/></svg>Exercices
        </a>
      </div>
      <div style="display: flex; gap: 6px; justify-content: center" role="img" aria-label="Page 1 sur 7">
        <div style="width: 20px; height: 6px; border-radius: 3px; background: {{a.encre}}"></div>
        <sc-for list="{{dots}}" as="d" hint-placeholder-count="6"><div style="width: 6px; height: 6px; border-radius: 3px; background: var(--texte3)"></div></sc-for>
      </div>
    </div>

    <section aria-label="Ce qui change dans cette séance" style="background: var(--surface); border-radius: 24px; padding: 18px; display: grid; grid-template-columns: 64px 1fr; gap: 14px; align-items: start">
      <span class="kx k-board" aria-hidden="true" style="width: 64px; height: 52px; color: var(--texte)"></span>
      <div style="display: flex; flex-direction: column; gap: 4px">
        <span style="color: var(--texte2); font-size: 13px; line-height: 18px">Ce qui change dans cette séance</span>
        <span>Koach ajoute 1 série à la suspension active.</span>
        <a href="#" style="display: flex; align-items: center; gap: 4px; height: 40px; color: {{a.encre}}; text-decoration: none; font-weight: 600">Voir le changement
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
        </a>
      </div>
    </section>

    <section aria-label="Comment tu te sens" style="background: var(--surface); border-radius: 24px; padding: 18px; display: flex; flex-direction: column; gap: 14px">
      <div style="display: grid; grid-template-columns: 1fr 60px; gap: 12px; align-items: center">
        <div style="display: flex; flex-direction: column; gap: 2px">
          <h2 style="margin: 0; font-family: 'Barlow Semi Condensed', sans-serif; font-weight: 600; font-size: 20px; line-height: 24px">Comment tu te sens ?</h2>
          <a href="#" style="display: flex; align-items: center; height: 36px; color: {{a.encre}}; font-size: 14px; font-weight: 600; text-decoration: none">Pourquoi je te le demande</a>
        </div>
        <span class="kx k-check" aria-hidden="true" style="width: 60px; height: 60px; color: var(--texte)"></span>
      </div>
      <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px">
        <sc-for list="{{moods}}" as="m" hint-placeholder-count="5">
          <button aria-pressed="{{m.pressed}}" onClick="{{m.pick}}" style="{{m.tile}}">
            <span class="kx {{m.cls}}" aria-hidden="true" style="width: 44px; height: 48px"></span>
            <span style="font-size: 12px; line-height: 16px; font-weight: 600">{{m.label}}</span>
          </button>
        </sc-for>
      </div>
    </section>

    <a href="Seance.dc.html" style="display: flex; align-items: center; justify-content: center; height: 48px; color: {{a.encre}}; text-decoration: none; font-weight: 600">Passer</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"palette":{"editor":"enum","options":["bordeaux","obsidian","arctic","neon","titanium","violet","forest","solar"],"default":"bordeaux"},"capitales":{"editor":"boolean","default":true},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { picked: '' }; }
  renderVals() {
    var T = {
      bordeaux: {fond: '#181819', surface: '#222223', haute: '#2D2C2E', filet: '#383738', texte: '#F3F0F1', texte2: '#ABABAF', texte3: '#77777A', pleine: '#873B38', surPleine: '#FFFFFF', encre: '#CA6F6A', second: '#B24B49', accent: '#D9A66C'},
      obsidian: {fond: '#121316', surface: '#1C1D20', haute: '#27272B', filet: '#313235', texte: '#F3F0F1', texte2: '#ABABAF', texte3: '#77777A', pleine: '#D73E44', surPleine: '#FFFFFF', encre: '#EA4C50', second: '#FF8566', accent: '#FFC857'},
      arctic: {fond: '#152238', surface: '#242D3D', haute: '#2F3748', filet: '#3A4354', texte: '#F3F0F1', texte2: '#ABABAF', texte3: '#77777A', pleine: '#2563EB', surPleine: '#FFFFFF', encre: '#668EFF', second: '#4F9CF9', accent: '#14B8A6'},
      neon: {fond: '#101510', surface: '#1A1F1A', haute: '#242A24', filet: '#2F342E', texte: '#F2F0ED', texte2: '#AAACA7', texte3: '#757873', pleine: '#B4F044', surPleine: '#111111', encre: '#B4F044', second: '#67D8C0', accent: '#8C72FF'},
      titanium: {fond: '#171E24', surface: '#21282F', haute: '#2C3339', filet: '#373E45', texte: '#F2F0F1', texte2: '#AAABAE', texte3: '#76777A', pleine: '#4C6474', surPleine: '#FFFFFF', encre: '#7992A3', second: '#8A9DA8', accent: '#D5A24C'},
      violet: {fond: '#181427', surface: '#221E31', haute: '#2D293C', filet: '#383347', texte: '#F4EFF1', texte2: '#AEAAAF', texte3: '#79767A', pleine: '#7546DB', surPleine: '#FFFFFF', encre: '#986CFF', second: '#AC8CFA', accent: '#29BFB0'},
      forest: {fond: '#17251D', surface: '#213027', haute: '#2C3B32', filet: '#37463D', texte: '#F2F0EE', texte2: '#A9ACA8', texte3: '#757874', pleine: '#236B50', surPleine: '#FFFFFF', encre: '#5CA283', second: '#7BAC81', accent: '#D7B374'},
      solar: {fond: '#211B1A', surface: '#2C2524', haute: '#37302F', filet: '#423B39', texte: '#F7EFED', texte2: '#B4A9A7', texte3: '#7F7573', pleine: '#CA4F1C', surPleine: '#FFFFFF', encre: '#E86531', second: '#FF9760', accent: '#E8BC49'}
    };
    var a = T[this.props.palette] || T.bordeaux;
    var caps = this.props.capitales !== false;
    var vars = '--fond: ' + a.fond + '; --surface: ' + a.surface + '; --haute: ' + a.haute + '; --filet: ' + a.filet + '; --texte: ' + a.texte + '; --texte2: ' + a.texte2 + '; --texte3: ' + a.texte3 + ';';
    var self = this;
    var base = 'all: unset; cursor: pointer; box-sizing: border-box; height: 96px; border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; ';
    var poses = { 'Pas bien': 'k-oops', 'Bof': 'k-shrug', 'Correct': 'k-ponder', 'Bien': 'k-thumbs', 'En forme': 'k-cheer' };
    var moods = ['Pas bien', 'Bof', 'Correct', 'Bien', 'En forme'].map(function (l) {
      var on = self.state.picked === l;
      return {
        label: l, cls: poses[l], pressed: on ? 'true' : 'false',
        tile: base + (on ? 'background: ' + a.pleine + '; color: ' + a.surPleine + ';' : 'background: ' + a.haute + '; color: ' + a.texte + ';'),
        pick: function () { self.setState({ picked: l }); }
      };
    });
    return { a: a, vars: vars, tt: caps ? 'uppercase' : 'none', ls: caps ? '.3px' : '0', moods: moods, dots: [1, 2, 3, 4, 5, 6] };
  }
}
</script>
</body>
</html>
