<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Fin de séance</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&amp;family=Barlow+Semi+Condensed:wght@500;600&amp;family=Barlow+Condensed:wght@500;600&amp;display=swap">
<style>
body{margin:0}
a{color:var(--texte)}a:hover{color:#FFFFFF}
</style>
</helmet>
<div style="{{vars}} width: 390px; height: 844px; position: relative; overflow: hidden; background: var(--fond); color: var(--texte); font-family: 'Barlow', sans-serif; font-size: 15px; line-height: 22px; box-sizing: border-box">
  <div style="padding: 40px 20px 104px; display: flex; flex-direction: column; gap: 24px">

    <div style="display: flex; flex-direction: column; gap: 2px">
      <div style="color: var(--texte2)">Squat et gainage</div>
      <h1 style="margin: 0; font-family: 'Barlow Semi Condensed', sans-serif; font-weight: 600; font-size: 30px; line-height: 36px">Séance terminée</h1>
    </div>

    <section aria-label="Record personnel" style="background: var(--surface); border-radius: 28px; padding: 20px; display: flex; flex-direction: column; gap: 6px; box-shadow: inset 0 0 0 1.5px {{a.accent}}">
      <div style="display: flex; align-items: center; gap: 8px; color: {{a.accent}}; font-weight: 600">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{a.accent}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4zM7 6H4a3 3 0 0 0 3 4M17 6h3a3 3 0 0 1-3 4"/></svg>
        Record personnel
      </div>
      <div style="font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 44px; line-height: 48px; font-variant-numeric: tabular-nums">120 kg × 3</div>
      <div style="color: var(--texte2)">Back squat. 1RM estimé 136 kg, 2 kg de plus que mardi.</div>
    </section>

    <section aria-label="Résumé" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <div style="background: var(--surface); border-radius: 16px; padding: 14px 16px"><div style="font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 30px; line-height: 34px">47 min</div><div style="color: var(--texte2); font-size: 13px">durée</div></div>
      <div style="background: var(--surface); border-radius: 16px; padding: 14px 16px"><div style="font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 30px; line-height: 34px">19 / 19</div><div style="color: var(--texte2); font-size: 13px">séries faites</div></div>
      <div style="background: var(--surface); border-radius: 16px; padding: 14px 16px"><div style="font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 30px; line-height: 34px">6 840 kg</div><div style="color: var(--texte2); font-size: 13px">tonnage</div></div>
      <div style="background: var(--surface); border-radius: 16px; padding: 14px 16px"><div style="font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 30px; line-height: 34px">RIR 2,4</div><div style="color: var(--texte2); font-size: 13px">moyen, cible 2</div></div>
    </section>

    <fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px">
      <legend style="padding: 0; margin-bottom: 10px; font-family: 'Barlow Semi Condensed', sans-serif; font-weight: 600; font-size: 22px; line-height: 28px">Comment tu te sens ?</legend>
      <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px">
        <sc-for list="{{moods}}" as="m" hint-placeholder-count="5">
          <button aria-pressed="{{m.pressed}}" onClick="{{m.onPick}}" style="{{m.style}}">{{m.label}}</button>
        </sc-for>
      </div>
    </fieldset>

    <div style="display: flex; justify-content: space-between; color: var(--texte2); font-size: 14px; padding: 0 2px">
      <span>Prochaine séance : dimanche, tirage.</span>
      <span style="color: var(--texte); font-weight: 600">+12 Krédits</span>
    </div>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 20px 20px; background: var(--fond); border-top: 1px solid var(--filet)">
    <a href="Main.dc.html" style="display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 16px; background: {{a.vive}}; color: {{a.on}}; font-weight: 600; font-size: 17px; text-decoration: none">Terminer</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"enum","options":["bordeaux","obsidian","arctic","neon","titanium","violet","forest","solar"],"default":"bordeaux"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { picked: 'Bien' }; }
  renderVals() {
    var T = {
      bordeaux: {fond: '#181819', surface: '#222223', haute: '#2D2C2E', filet: '#383738', texte: '#F3F0F1', texte2: '#ABABAF', texte3: '#77777A', pleine: '#873B38', surPleine: '#FFFFFF', encre: '#CA6F6A', second: '#B24B49', accent: '#D9A66C'},
      obsidian: {fond: '#121316', surface: '#1C1D20', haute: '#27272B', filet: '#313235', texte: '#F3F0F1', texte2: '#ABABAF', texte3: '#77777A', pleine: '#D73E44', surPleine: '#FFFFFF', encre: '#EA4C50', second: '#FF8566', accent: '#FFC857'},
      arctic: {fond: '#152238', surface: '#242D3D', haute: '#2F3748', filet: '#3A4354', texte: '#F3F0F1', texte2: '#ABABAF', texte3: '#77777A', pleine: '#2563EB', surPleine: '#FFFFFF', encre: '#668EFF', second: '#4F9CF9', accent: '#14B8A6'},
      neon: {fond: '#101510', surface: '#1A1F1A', haute: '#242A24', filet: '#2F342E', texte: '#F2F0ED', texte2: '#AAACA7', texte3: '#757873', pleine: '#B4F044', surPleine: '#111111', encre: '#B4F044', second: '#67D8C0', accent: '#8C72FF'},
      titanium: {fond: '#171E24', surface: '#21282F', haute: '#2C3339', filet: '#373E45', texte: '#F2F0F1', texte2: '#AAABAE', texte3: '#76777A', pleine: '#4C6474', surPleine: '#FFFFFF', encre: '#7992A3', second: '#8A9DA8', accent: '#D5A24C'},
      violet: {fond: '#181427', surface: '#221E31', haute: '#2D293C', filet: '#383347', texte: '#F4EFF1', texte2: '#AEAAAF', texte3: '#79767A', pleine: '#7546DB', surPleine: '#FFFFFF', encre: '#986CFF', second: '#AC8CFA', accent: '#29BFB0'},
      forest: {fond: '#17251D', surface: '#213027', haute: '#2C3B32', filet: '#37463D', texte: '#F2F0EE', texte2: '#A9ACA8', texte3: '#757874', pleine: '#236B50', surPleine: '#FFFFFF', encre: '#5CA283', second: '#7BAC81', accent: '#D7B374'},
      solar: {fond: '#211B1A', surface: '#2C2524', haute: '#37302F', filet: '#423B39', texte: '#F7EFED', texte2: '#B4A9A7', texte3: '#7F7573', pleine: '#CA4F1C', surPleine: '#FFFFFF', encre: '#E86531', second: '#FF9760', accent: '#E8BC49'}
    };
    var a = T[this.props.accent] || T.bordeaux;
    a.vive = a.pleine; a.ink = a.encre; a.on = a.surPleine;
    var vars = '--fond: ' + a.fond + '; --surface: ' + a.surface + '; --haute: ' + a.haute + '; --filet: ' + a.filet + '; --texte: ' + a.texte + '; --texte2: ' + a.texte2 + '; --texte3: ' + a.texte3 + ';';
    var self = this;
    var base = 'all: unset; cursor: pointer; box-sizing: border-box; height: 48px; border-radius: 14px; text-align: center; font-size: 13px; font-weight: 600; ';
    var moods = ['Vidé', 'Fatigué', 'Correct', 'Bien', 'En forme'].map(function (l) {
      var on = self.state.picked === l;
      return {
        label: l, pressed: on ? 'true' : 'false',
        style: base + (on ? 'background: ' + a.vive + '; color: ' + a.on + ';' : 'background: var(--surface); color: var(--texte);'),
        onPick: function () { self.setState({ picked: l }); }
      };
    });
    return { a: a, moods: moods, vars: vars };
  }
}
</script>
</body>
</html>
