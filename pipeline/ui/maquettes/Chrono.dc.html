<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Série validée et repos, après</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&amp;family=Barlow+Semi+Condensed:wght@500;600&amp;family=Barlow+Condensed:wght@500;600&amp;display=swap">
<style>
body{margin:0}
a{color:inherit}a:hover{color:inherit}
.kx{display:block;background:currentColor;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center;-webkit-mask-size:contain;mask-size:contain}
.k-thumbs{-webkit-mask-image:url(/_blob/07b89e486a85743f01575de2ab4e91cb);mask-image:url(/_blob/07b89e486a85743f01575de2ab4e91cb)}
</style>
</helmet>
<div style="{{vars}} width: 390px; height: 844px; position: relative; overflow: hidden; background: var(--fond); color: var(--texte); font-family: 'Barlow', sans-serif; font-size: 15px; line-height: 22px; box-sizing: border-box">
  <div style="padding: 8px 20px 200px; display: flex; flex-direction: column; gap: 14px">

    <header style="display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; min-height: 64px">
      <a href="Seance.dc.html" aria-label="Retour" style="width: 44px; height: 44px; display: flex; align-items: center">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--texte)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
      </a>
      <div style="display: flex; flex-direction: column; min-width: 0">
        <h1 style="margin: 0; font-family: 'Barlow Semi Condensed', sans-serif; font-weight: 600; font-size: 20px; line-height: 24px; text-transform: {{tt}}; letter-spacing: {{ls}}">Corps entier</h1>
        <span style="color: var(--texte2); font-size: 13px; line-height: 18px">S1, J2</span>
      </div>
      <button aria-label="Plus d'actions" style="all: unset; cursor: pointer; width: 44px; height: 44px; display: flex; align-items: center; justify-content: flex-end">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="var(--texte)" aria-hidden="true"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>
      </button>
    </header>

    <div style="display: flex; align-items: center; justify-content: space-between">
      <span style="color: var(--texte2); font-size: 14px">Exercice 7 sur 10</span>
      <a href="#" style="display: flex; align-items: center; gap: 8px; height: 44px; color: {{a.encre}}; text-decoration: none; font-weight: 600">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 9h8M8 13h8M8 17h5"/></svg>Exercices
      </a>
    </div>

    <section aria-label="Tenue en L" style="background: var(--surface); border-radius: 24px; padding: 18px; display: flex; flex-direction: column; gap: 14px">
      <h2 style="margin: 0; font-family: 'Barlow Semi Condensed', sans-serif; font-weight: 600; font-size: 20px; line-height: 24px; text-transform: {{tt}}; letter-spacing: {{ls}}">Tenue en L au sol</h2>
      <div style="display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap">
        <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 36px; line-height: 38px; color: {{a.encre}}">3 × 3 à 10 s</span>
        <span style="height: 28px; padding: 0 10px; border-radius: 8px; background: var(--haute); color: var(--texte2); font-size: 13px; line-height: 28px">RIR 2</span>
        <span style="height: 28px; padding: 0 10px; border-radius: 8px; background: var(--haute); color: var(--texte2); font-size: 13px; line-height: 28px">Repos 2 min 30 s</span>
      </div>
      <span style="color: var(--texte2); font-size: 14px; line-height: 20px">Lance le chrono à chaque tenue ; arrête avant de perdre la position.</span>

      <div style="display: flex; flex-direction: column; gap: 8px">
        <div style="display: grid; grid-template-columns: 44px 1fr 44px 44px; gap: 8px; color: var(--texte2); font-size: 13px; line-height: 18px"><span>N°</span><span style="text-align: center">Tenues de 10 s</span><span></span><span></span></div>
        <div style="display: grid; grid-template-columns: 44px 1fr 44px 44px; gap: 8px; align-items: center">
          <span style="color: var(--texte2); font-family: 'Barlow Condensed', sans-serif; font-size: 16px">1</span>
          <span style="height: 48px; border-radius: 14px; background: var(--haute); text-align: center; font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 20px; line-height: 48px">3</span>
          <span></span>
          <svg width="44" height="44" viewBox="0 0 44 44" role="img" aria-label="Série 1 validée"><circle cx="22" cy="22" r="18" fill="#5CB860"/><path d="M14.5 22.5l5 5 10-11" fill="none" stroke="var(--fond)" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <div style="display: flex; align-items: center; justify-content: space-between; padding: 0 0 0 52px">
          <span style="font-size: 14px"><span style="font-weight: 600">Dur</span><span style="color: var(--texte2)">, RIR 2</span></span>
          <a href="#" style="color: {{a.encre}}; font-size: 14px; font-weight: 600; text-decoration: none; height: 36px; display: flex; align-items: center">Modifier</a>
        </div>
        <div style="display: grid; grid-template-columns: 44px 1fr 44px 44px; gap: 8px; align-items: center; padding: 6px 0 6px 10px; margin: 0 -10px; border-radius: 16px; background: var(--haute); box-shadow: inset 0 0 0 1.5px {{a.encre}}">
          <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 16px">2</span>
          <span style="height: 48px; border-radius: 14px; background: var(--surface); text-align: center; font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 20px; line-height: 48px">3</span>
          <button aria-label="Lancer le chrono de tenue" style="all: unset; cursor: pointer; width: 44px; height: 44px; border-radius: 14px; background: var(--surface); display: flex; align-items: center; justify-content: center">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{a.encre}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12M6 21h12M7 3c0 5 5 6 5 9s-5 4-5 9M17 3c0 5-5 6-5 9s5 4 5 9"/></svg>
          </button>
          <button aria-label="Valider la série 2" style="all: unset; cursor: pointer; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--texte2)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
          </button>
        </div>
        <div style="display: grid; grid-template-columns: 44px 1fr 44px 44px; gap: 8px; align-items: center; color: var(--texte3)">
          <span style="font-family: 'Barlow Condensed', sans-serif; font-size: 16px">3</span>
          <span style="height: 48px; border-radius: 14px; background: var(--haute); text-align: center; font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 20px; line-height: 48px">3</span>
          <span></span><span></span>
        </div>
      </div>
    </section>
  </div>

  <div role="status" style="position: absolute; left: 16px; right: 16px; bottom: 112px; height: 52px; border-radius: 16px; background: var(--texte); color: var(--fond); display: flex; align-items: center; justify-content: space-between; padding: 0 8px 0 16px">
    <span style="display: flex; align-items: center; gap: 10px; font-size: 14px"><span class="kx k-thumbs" aria-hidden="true" style="width: 28px; height: 36px"></span>Koach : série suivante dans 2 s</span>
    <button style="all: unset; cursor: pointer; height: 44px; padding: 0 12px; font-weight: 700; font-size: 14px; color: var(--fond); text-decoration: underline; text-underline-offset: 3px">Annuler</button>
  </div>

  <section aria-label="Repos" style="position: absolute; left: 16px; right: 16px; bottom: 20px; border-radius: 24px; background: var(--haute); box-shadow: inset 0 0 0 1px var(--filet); overflow: hidden">
    <div style="height: 4px; background: var(--filet)" role="progressbar" aria-valuemin="0" aria-valuemax="150" aria-valuenow="147" aria-label="Repos restant"><div style="width: 98%; height: 4px; background: {{a.encre}}"></div></div>
    <div style="display: flex; align-items: center; justify-content: space-between; height: 76px; padding: 0 10px 0 18px">
      <div style="display: flex; flex-direction: column">
        <span style="color: var(--texte2); font-size: 12px; line-height: 16px">Repos</span>
        <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 34px; line-height: 36px; font-variant-numeric: tabular-nums">2:27</span>
      </div>
      <div style="display: flex; align-items: center; gap: 6px">
        <div style="display: flex; gap: 2px">
          <button style="all: unset; cursor: pointer; height: 44px; padding: 0 12px; border-radius: 14px 4px 4px 14px; background: var(--surface); font-weight: 600; font-size: 14px">−15 s</button>
          <button style="all: unset; cursor: pointer; height: 44px; padding: 0 12px; border-radius: 4px 14px 14px 4px; background: var(--surface); font-weight: 600; font-size: 14px">+15 s</button>
        </div>
        <button aria-label="Arrêter le repos" style="all: unset; cursor: pointer; width: 44px; height: 44px; border-radius: 22px; background: {{a.pleine}}; display: flex; align-items: center; justify-content: center">
          <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="3" width="10" height="10" rx="2" fill="{{a.on}}"/></svg>
        </button>
      </div>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"palette":{"editor":"enum","options":["bordeaux","obsidian","arctic","neon","titanium","violet","forest","solar"],"default":"bordeaux"},"capitales":{"editor":"boolean","default":true},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var T = {
      bordeaux: {fond: '#181819', surface: '#222223', haute: '#2D2C2E', filet: '#383738', texte: '#F3F0F1', texte2: '#ABABAF', texte3: '#77777A', pleine: '#551515', surPleine: '#FFFFFF', encre: '#CA6F6A', second: '#B24B49', accent: '#D9A66C'},
      obsidian: {fond: '#121316', surface: '#1C1D20', haute: '#27272B', filet: '#313235', texte: '#F3F0F1', texte2: '#ABABAF', texte3: '#77777A', pleine: '#E5484D', surPleine: '#111111', encre: '#EA4C50', second: '#FF8566', accent: '#FFC857'},
      arctic: {fond: '#152238', surface: '#242D3D', haute: '#2F3748', filet: '#3A4354', texte: '#F3F0F1', texte2: '#ABABAF', texte3: '#77777A', pleine: '#2563EB', surPleine: '#FFFFFF', encre: '#668EFF', second: '#4F9CF9', accent: '#14B8A6'},
      neon: {fond: '#101510', surface: '#1A1F1A', haute: '#242A24', filet: '#2F342E', texte: '#F2F0ED', texte2: '#AAACA7', texte3: '#757873', pleine: '#B4F044', surPleine: '#111111', encre: '#B4F044', second: '#67D8C0', accent: '#8C72FF'},
      titanium: {fond: '#171E24', surface: '#21282F', haute: '#2C3339', filet: '#373E45', texte: '#F2F0F1', texte2: '#AAABAE', texte3: '#76777A', pleine: '#4C6474', surPleine: '#FFFFFF', encre: '#7992A3', second: '#8A9DA8', accent: '#D5A24C'},
      violet: {fond: '#181427', surface: '#221E31', haute: '#2D293C', filet: '#383347', texte: '#F4EFF1', texte2: '#AEAAAF', texte3: '#79767A', pleine: '#7546DB', surPleine: '#FFFFFF', encre: '#986CFF', second: '#AC8CFA', accent: '#29BFB0'},
      forest: {fond: '#17251D', surface: '#213027', haute: '#2C3B32', filet: '#37463D', texte: '#F2F0EE', texte2: '#A9ACA8', texte3: '#757874', pleine: '#236B50', surPleine: '#FFFFFF', encre: '#5CA283', second: '#7BAC81', accent: '#D7B374'},
      solar: {fond: '#211B1A', surface: '#2C2524', haute: '#37302F', filet: '#423B39', texte: '#F7EFED', texte2: '#B4A9A7', texte3: '#7F7573', pleine: '#D95A27', surPleine: '#111111', encre: '#E86531', second: '#FF9760', accent: '#E8BC49'}
    };
    var a = T[this.props.palette] || T.bordeaux;
    a.on = a.surPleine;
    var caps = this.props.capitales !== false;
    var vars = '--fond: ' + a.fond + '; --surface: ' + a.surface + '; --haute: ' + a.haute + '; --filet: ' + a.filet + '; --texte: ' + a.texte + '; --texte2: ' + a.texte2 + '; --texte3: ' + a.texte3 + ';';
    return { a: a, vars: vars, tt: caps ? 'uppercase' : 'none', ls: caps ? '.3px' : '0' };
  }
}
</script>
</body>
</html>
