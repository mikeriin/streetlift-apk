<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Menu de la séance, après</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&amp;family=Barlow+Semi+Condensed:wght@500;600&amp;family=Barlow+Condensed:wght@500;600&amp;display=swap">
<style>
body{margin:0}
a{color:inherit}a:hover{color:inherit}
</style>
</helmet>
<div style="{{vars}} width: 390px; height: 844px; position: relative; overflow: hidden; background: var(--fond); color: var(--texte); font-family: 'Barlow', sans-serif; font-size: 15px; line-height: 22px; box-sizing: border-box">
  <div aria-hidden="true" style="padding: 18px 20px; display: flex; flex-direction: column; gap: 16px; opacity: .4">
    <div style="display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; min-height: 56px">
      <span></span>
      <span style="font-family: 'Barlow Semi Condensed', sans-serif; font-weight: 600; font-size: 20px; text-transform: {{tt}}">Corps entier</span>
      <span></span>
    </div>
    <div style="height: 300px; border-radius: 24px; background: var(--surface)"></div>
  </div>
  <div style="position: absolute; inset: 0; background: rgba(0,0,0,.55)"></div>

  <section role="dialog" aria-label="Actions de la séance" style="position: absolute; left: 0; right: 0; bottom: 0; background: var(--surface); border-radius: 28px 28px 0 0; padding: 10px 16px 20px; display: flex; flex-direction: column; gap: 10px">
    <div style="align-self: center; width: 36px; height: 4px; border-radius: 2px; background: var(--texte3)"></div>
    <div style="display: flex; flex-direction: column; padding: 6px 4px 4px">
      <h2 style="margin: 0; font-family: 'Barlow Semi Condensed', sans-serif; font-weight: 600; font-size: 20px; line-height: 24px">Séance</h2>
      <span style="color: var(--texte2); font-size: 13px">Corps entier, S1, J2</span>
    </div>

    <sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
      <div style="border-radius: 20px; background: var(--haute); padding: 2px 0">
        <sc-for list="{{g.rows}}" as="r" hint-placeholder-count="2">
          <button style="{{r.row}}">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{r.ink}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{r.icon}}"/></svg>
            <span style="{{r.label}}">{{r.t}}</span>
          </button>
        </sc-for>
      </div>
    </sc-for>

    <button style="all: unset; cursor: pointer; box-sizing: border-box; height: 52px; border-radius: 16px; text-align: center; font-weight: 600; color: var(--texte2)">Fermer</button>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"palette":{"editor":"enum","options":["bordeaux","obsidian","arctic","neon","titanium","violet","forest","solar"],"default":"bordeaux"},"capitales":{"editor":"boolean","default":true},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var T = {
      bordeaux: {fond: '#181819', surface: '#222223', haute: '#2D2C2E', filet: '#383738', texte: '#F3F0F1', texte2: '#ABABAF', texte3: '#77777A', pleine: '#551515', surPleine: '#FFFFFF', encre: '#CA6F6A', second: '#B24B49', accent: '#D9A66C'},
      obsidian: {fond: '#121316', surface: '#1C1D20', haute: '#27272B', filet: '#313235', texte: '#F3F0F1', texte2: '#ABABAF', texte3: '#77777A', pleine: '#E5484D', surPleine: '#111111', encre: '#EA4C50', second: '#FF8566', accent: '#FFC857'},
      arctic: {fond: '#152238', surface: '#242D3D', haute: '#2F3748', filet: '#3A4354', texte: '#F3F0F1', texte2: '#ABABAF', texte3: '#77777A', pleine: '#2563EB', surPleine: '#FFFFFF', encre: '#668EFF', second: '#4F9CF9', accent: '#14B8A6'},
      neon: {fond: '#101510', surface: '#1A1F1A', haute: '#242A24', filet: '#2F342E', texte: '#F2F0ED', texte2: '#AAACA7', texte3: '#757873', pleine: '#B4F044', surPleine: '#111111', encre: '#B4F044', second: '#67D8C0', accent: '#8C72FF'},
      titanium: {fond: '#171E24', surface: '#21282F', haute: '#2C3339', filet: '#373E45', texte: '#F2F0F1', texte2: '#AAABAE', texte3: '#76777A', pleine: '#4C6474', surPleine: '#FFFFFF', encre: '#7992A3', second: '#8A9DA8', accent: '#D5A24C'},
      violet: {fond: '#181427', surface: '#221E31', haute: '#2D293C', filet: '#383347', texte: '#F4EFF1', texte2: '#AEAAAF', texte3: '#79767A', pleine: '#7546DB', surPleine: '#FFFFFF', encre: '#986CFF', second: '#AC8CFA', accent: '#29BFB0'},
      forest: {fond: '#17251D', surface: '#213027', haute: '#2C3B32', filet: '#37463D', texte: '#F2F0EE', texte2: '#A9ACA8', texte3: '#757874', pleine: '#236B50', surPleine: '#FFFFFF', encre: '#5CA283', second: '#7BAC81', accent: '#D7B374'},
      solar: {fond: '#211B1A', surface: '#2C2524', haute: '#37302F', filet: '#423B39', texte: '#F7EFED', texte2: '#B4A9A7', texte3: '#7F7573', pleine: '#D95A27', surPleine: '#111111', encre: '#E86531', second: '#FF9760', accent: '#E8BC49'}
    };
    var a = T[this.props.palette] || T.bordeaux;
    var caps = this.props.capitales !== false;
    var vars = '--fond: ' + a.fond + '; --surface: ' + a.surface + '; --haute: ' + a.haute + '; --filet: ' + a.filet + '; --texte: ' + a.texte + '; --texte2: ' + a.texte2 + '; --texte3: ' + a.texte3 + ';';
    var DANGER = '#EF6B6B', WARN = '#E6A23C';
    var G = [
      [
        ['Consignes de séance', 'M4 5a2 2 0 0 1 2-2h12v16H6a2 2 0 0 0-2 2zM4 21V5M8 7h6'],
        ['Bilan du jour', 'M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z'],
        ['J’ai seulement… minutes', 'M12 8v5l3 2M9 2h6M12 4a9 9 0 1 0 0 18 9 9 0 0 0 0-18z'],
        ['Je m’entraîne ailleurs', 'M12 21s-6-5.3-6-11a6 6 0 0 1 12 0c0 5.7-6 11-6 11zM12 12a2 2 0 1 0 0-4 2 2 0 0 0 0 4z']
      ],
      [
        ['Douleur ou malaise ?', 'M12 9v4M12 16.5v.5M10.3 3.9L2.4 18a2 2 0 0 0 1.7 3h15.8a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z', WARN],
        ['Références (feuille Pilotage)', 'M4 7h10M18 7h2M4 17h4M12 17h8M16 5v4M10 15v4']
      ],
      [
        ['Effacer l’historique de cette séance', 'M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v6M14 11v6', DANGER]
      ]
    ];
    var groups = G.map(function (g) {
      return { rows: g.map(function (r, i) {
        var ink = r[2] || 'var(--texte)';
        return { t: r[0], icon: r[1], ink: ink,
          label: 'flex: 1; text-align: left; font-size: 16px; font-weight: 500; color: ' + (r[2] === DANGER ? DANGER : 'var(--texte)') + ';',
          row: 'all: unset; cursor: pointer; box-sizing: border-box; width: 100%; display: flex; align-items: center; gap: 14px; min-height: 56px; padding: 0 16px; ' + (i < g.length - 1 ? 'border-bottom: 1px solid var(--filet);' : '') };
      }) };
    });
    return { a: a, vars: vars, tt: caps ? 'uppercase' : 'none', ls: caps ? '.3px' : '0', groups: groups };
  }
}
</script>
</body>
</html>
