<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Progrès</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&amp;family=Barlow+Semi+Condensed:wght@500;600&amp;family=Barlow+Condensed:wght@500;600&amp;display=swap">
<style>
body{margin:0}
a{color:var(--texte)}a:hover{color:#FFFFFF}
</style>
</helmet>
<div style="{{vars}} width: 390px; height: 844px; position: relative; overflow: hidden; background: var(--fond); color: var(--texte); font-family: 'Barlow', sans-serif; font-size: 15px; line-height: 22px; box-sizing: border-box">
  <div style="padding: 28px 20px 96px; display: flex; flex-direction: column; gap: 22px">

    <div style="display: flex; flex-direction: column; gap: 2px">
      <h1 style="margin: 0; font-family: 'Barlow Semi Condensed', sans-serif; font-weight: 600; font-size: 30px; line-height: 36px">Progrès</h1>
      <div style="color: var(--texte2)">Objectifs du 18 avril 2027</div>
    </div>

    <section aria-label="Force" style="display: flex; flex-direction: column; gap: 10px">
      <sc-for list="{{lifts}}" as="l" hint-placeholder-count="4">
        <div style="background: var(--surface); border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px">
          <div style="display: flex; justify-content: space-between; align-items: flex-end">
            <div style="display: flex; flex-direction: column">
              <span style="color: var(--texte2); font-size: 14px">{{l.name}}</span>
              <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 34px; line-height: 36px; font-variant-numeric: tabular-nums">{{l.now}}</span>
            </div>
            <div style="display: flex; flex-direction: column; align-items: flex-end">
              <span style="color: var(--texte2); font-size: 13px">objectif</span>
              <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 500; font-size: 22px; line-height: 26px; font-variant-numeric: tabular-nums">{{l.target}}</span>
            </div>
          </div>
          <div style="height: 8px; border-radius: 4px; background: var(--filet); overflow: hidden" role="img" aria-label="{{l.aria}}">
            <div style="{{l.fill}}"></div>
          </div>
          <div style="color: var(--texte2); font-size: 13px; line-height: 18px">{{l.delta}}</div>
        </div>
      </sc-for>
    </section>

    <section aria-label="Endurance au poids de corps" style="display: flex; flex-direction: column">
      <h2 style="margin: 0 0 6px; font-family: 'Barlow Semi Condensed', sans-serif; font-weight: 600; font-size: 22px; line-height: 28px">Endurance au poids de corps</h2>
      <sc-for list="{{endu}}" as="e" hint-placeholder-count="5">
        <div style="display: grid; grid-template-columns: 1fr 72px auto; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--filet)">
          <span>{{e.name}}</span>
          <div style="height: 6px; border-radius: 3px; background: var(--filet); overflow: hidden"><div style="{{e.fill}}"></div></div>
          <span style="font-variant-numeric: tabular-nums; min-width: 64px; text-align: right">{{e.now}}<span style="color: var(--texte2)"> / {{e.target}}</span></span>
        </div>
      </sc-for>
    </section>
  </div>

  <nav aria-label="Navigation principale" style="position: absolute; left: 0; right: 0; bottom: 0; height: 72px; background: var(--surface); border-top: 1px solid var(--filet); display: grid; grid-template-columns: repeat(4, minmax(0, 1fr))">
    <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: var(--texte2); font-size: 12px">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--texte2)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg>Aujourd'hui</a>
    <a href="Programme.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: var(--texte2); font-size: 12px">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--texte2)" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Programme</a>
    <a href="Progres.dc.html" aria-current="page" style="position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: var(--texte); font-size: 12px; font-weight: 600">
      <div style="position: absolute; top: 0; width: 28px; height: 3px; border-radius: 0 0 3px 3px; background: {{a.ink}}"></div>
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="{{a.ink}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19l5-6 4 3 7-9"/><path d="M15 7h5v5"/></svg>Progrès</a>
    <a href="#" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: var(--texte2); font-size: 12px">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--texte2)" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M3 9v6M21 9v6M6 6v12M18 6v12M6 12h12"/></svg>Exercices</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"enum","options":["bordeaux","obsidian","arctic","neon","titanium","violet","forest","solar"],"default":"bordeaux"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var T = {
      bordeaux: {fond: '#181819', surface: '#222223', haute: '#2D2C2E', filet: '#383738', texte: '#F3F0F1', texte2: '#ABABAF', texte3: '#77777A', pleine: '#873B38', surPleine: '#FFFFFF', encre: '#CA6F6A', second: '#B24B49', accent: '#D9A66C'},
      obsidian: {fond: '#121316', surface: '#1C1D20', haute: '#27272B', filet: '#313235', texte: '#F3F0F1', texte2: '#ABABAF', texte3: '#77777A', pleine: '#D73E44', surPleine: '#FFFFFF', encre: '#EA4C50', second: '#FF8566', accent: '#FFC857'},
      arctic: {fond: '#152238', surface: '#242D3D', haute: '#2F3748', filet: '#3A4354', texte: '#F3F0F1', texte2: '#ABABAF', texte3: '#77777A', pleine: '#2563EB', surPleine: '#FFFFFF', encre: '#668EFF', second: '#4F9CF9', accent: '#14B8A6'},
      neon: {fond: '#101510', surface: '#1A1F1A', haute: '#242A24', filet: '#2F342E', texte: '#F2F0ED', texte2: '#AAACA7', texte3: '#757873', pleine: '#B4F044', surPleine: '#111111', encre: '#B4F044', second: '#67D8C0', accent: '#8C72FF'},
      titanium: {fond: '#171E24', surface: '#21282F', haute: '#2C3339', filet: '#373E45', texte: '#F2F0F1', texte2: '#AAABAE', texte3: '#76777A', pleine: '#4C6474', surPleine: '#FFFFFF', encre: '#7992A3', second: '#8A9DA8', accent: '#D5A24C'},
      violet: {fond: '#181427', surface: '#221E31', haute: '#2D293C', filet: '#383347', texte: '#F4EFF1', texte2: '#AEAAAF', texte3: '#79767A', pleine: '#7546DB', surPleine: '#FFFFFF', encre: '#986CFF', second: '#AC8CFA', accent: '#29BFB0'},
      forest: {fond: '#17251D', surface: '#213027', haute: '#2C3B32', filet: '#37463D', texte: '#F2F0EE', texte2: '#A9ACA8', texte3: '#757874', pleine: '#236B50', surPleine: '#FFFFFF', encre: '#5CA283', second: '#7BAC81', accent: '#D7B374'},
      solar: {fond: '#211B1A', surface: '#2C2524', haute: '#37302F', filet: '#423B39', texte: '#F7EFED', texte2: '#B4A9A7', texte3: '#7F7573', pleine: '#CA4F1C', surPleine: '#FFFFFF', encre: '#E86531', second: '#FF9760', accent: '#E8BC49'}
    };
    var a = T[this.props.accent] || T.bordeaux;
    a.vive = a.pleine; a.ink = a.encre; a.on = a.surPleine;
    var vars = '--fond: ' + a.fond + '; --surface: ' + a.surface + '; --haute: ' + a.haute + '; --filet: ' + a.filet + '; --texte: ' + a.texte + '; --texte2: ' + a.texte2 + '; --texte3: ' + a.texte3 + ';';
    var raw = [
      ['Traction lestée, 1RM', '+60 kg', '+75 kg', 40, '+10 kg depuis juillet, 15 kg à prendre'],
      ['Dip lesté, 1RM', '+90 kg', '+100 kg', 67, '+20 kg depuis juillet, 10 kg à prendre'],
      ['Muscle-up lesté, 1RM', '+20 kg', '+25 kg', 60, '+7,5 kg depuis juillet, 5 kg à prendre'],
      ['Back squat, 1RM', '140 kg', '150 kg', 71, '+25 kg depuis juillet, 10 kg à prendre']
    ];
    var lifts = raw.map(function (r) {
      return {
        name: r[0], now: r[1], target: r[2], delta: r[4], aria: r[3] + ' % du chemin vers l’objectif',
        fill: 'width: ' + r[3] + '%; height: 8px; border-radius: 4px; background: ' + a.ink + ';'
      };
    });
    var e = [['Muscle-ups', 11, 20], ['Tractions', 31, 50], ['Dips', 80, 110], ['Pompes', 72, 100], ['Squats à 70 kg', 30, 45]];
    var endu = e.map(function (r) {
      return { name: r[0], now: r[1], target: r[2], fill: 'width: ' + Math.round(100 * r[1] / r[2]) + '%; height: 6px; background: ' + a.second + ';' };
    });
    return { a: a, lifts: lifts, endu: endu, vars: vars };
  }
}
</script>
</body>
</html>
