<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Séance, repos</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&amp;family=Barlow+Semi+Condensed:wght@500;600&amp;family=Barlow+Condensed:wght@500;600&amp;display=swap">
<style>
body{margin:0}
a{color:var(--texte)}a:hover{color:#FFFFFF}
</style>
</helmet>
<div style="{{vars}} width: 390px; height: 844px; position: relative; overflow: hidden; background: var(--fond); color: var(--texte); font-family: 'Barlow', sans-serif; font-size: 15px; line-height: 22px; box-sizing: border-box">
  <div style="padding: 12px 20px 24px; display: flex; flex-direction: column; gap: 28px">

    <div style="display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; align-items: center; justify-content: space-between; height: 48px">
        <a href="Main.dc.html" aria-label="Quitter la séance" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; margin-left: -10px">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--texte)" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </a>
        <div style="color: var(--texte2); font-size: 14px">Dips lestés, série 2 sur 4</div>
        <div style="width: 44px"></div>
      </div>
      <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px" role="img" aria-label="Exercice 3 sur 7">
        <div style="height: 4px; border-radius: 2px; background: var(--texte)"></div>
        <div style="height: 4px; border-radius: 2px; background: var(--texte)"></div>
        <div style="height: 4px; border-radius: 2px; background: {{a.ink}}"></div>
        <div style="height: 4px; border-radius: 2px; background: var(--filet)"></div>
        <div style="height: 4px; border-radius: 2px; background: var(--filet)"></div>
        <div style="height: 4px; border-radius: 2px; background: var(--filet)"></div>
        <div style="height: 4px; border-radius: 2px; background: var(--filet)"></div>
      </div>
    </div>

    <section aria-label="Repos" style="display: flex; flex-direction: column; align-items: center; gap: 8px; padding-top: 12px">
      <div style="color: var(--texte2); font-size: 17px">Repos</div>
      <div style="font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 120px; line-height: 116px; font-variant-numeric: tabular-nums; letter-spacing: -2px">2:47</div>
      <div style="width: 100%; height: 6px; border-radius: 3px; background: var(--filet); overflow: hidden" role="progressbar" aria-valuemin="0" aria-valuemax="240" aria-valuenow="167" aria-label="Temps de repos restant">
        <div style="width: 70%; height: 6px; background: {{a.ink}}"></div>
      </div>
      <div style="width: 100%; display: flex; justify-content: space-between; color: var(--texte2); font-size: 14px"><span>sur 4:00</span><span>fin à 10:52</span></div>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; width: 100%; margin-top: 8px">
        <button style="all: unset; cursor: pointer; height: 48px; border-radius: 16px; background: var(--surface); text-align: center; font-weight: 600">−15 s</button>
        <button style="all: unset; cursor: pointer; height: 48px; border-radius: 16px; background: var(--surface); text-align: center; font-weight: 600">+15 s</button>
        <a href="Seance.dc.html" style="display: flex; align-items: center; justify-content: center; height: 48px; border-radius: 16px; background: var(--surface); text-decoration: none; font-weight: 600">Passer</a>
      </div>
    </section>

    <section aria-label="Série 2 notée" style="background: var(--surface); border-radius: 28px; padding: 20px; display: flex; flex-direction: column; gap: 14px">
      <div style="display: flex; justify-content: space-between; align-items: baseline">
        <h2 style="margin: 0; font-family: 'Barlow Semi Condensed', sans-serif; font-weight: 600; font-size: 22px; line-height: 28px">Série 2 notée</h2>
        <span style="color: var(--texte2); font-variant-numeric: tabular-nums">5 reps à +32,5 kg</span>
      </div>
      <fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px">
        <legend style="padding: 0; margin-bottom: 10px">Combien de reps en réserve ?</legend>
        <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px">
          <sc-for list="{{rir}}" as="r" hint-placeholder-count="6">
            <button aria-pressed="{{r.pressed}}" onClick="{{r.onPick}}" style="{{r.style}}">{{r.label}}</button>
          </sc-for>
        </div>
      </fieldset>
      <div style="color: var(--texte2); font-size: 14px">Cible : RIR 4. Ta réponse règle la série suivante.</div>
    </section>

    <section aria-label="Série suivante" style="display: flex; justify-content: space-between; align-items: center; padding: 0 4px">
      <div style="display: flex; flex-direction: column">
        <span style="color: var(--texte2); font-size: 14px">Ensuite</span>
        <span style="font-size: 17px; font-weight: 500">Série 3 : 5 reps à +32,5 kg</span>
      </div>
      <svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true"><rect x="0" y="0" width="40" height="40" rx="12" fill="var(--surface)"/><path d="M17 13l7 7-7 7" fill="none" stroke="var(--texte)" stroke-width="2" stroke-linecap="round"/></svg>
    </section>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"enum","options":["bordeaux","obsidian","arctic","neon","titanium","violet","forest","solar"],"default":"bordeaux"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { picked: '4' }; }
  renderVals() {
    var T = {
      bordeaux: {fond: '#181819', surface: '#222223', haute: '#2D2C2E', filet: '#383738', texte: '#F3F0F1', texte2: '#ABABAF', texte3: '#77777A', pleine: '#873B38', surPleine: '#FFFFFF', encre: '#CA6F6A', second: '#B24B49', accent: '#D9A66C'},
      obsidian: {fond: '#121316', surface: '#1C1D20', haute: '#27272B', filet: '#313235', texte: '#F3F0F1', texte2: '#ABABAF', texte3: '#77777A', pleine: '#D73E44', surPleine: '#FFFFFF', encre: '#EA4C50', second: '#FF8566', accent: '#FFC857'},
      arctic: {fond: '#152238', surface: '#242D3D', haute: '#2F3748', filet: '#3A4354', texte: '#F3F0F1', texte2: '#ABABAF', texte3: '#77777A', pleine: '#2563EB', surPleine: '#FFFFFF', encre: '#668EFF', second: '#4F9CF9', accent: '#14B8A6'},
      neon: {fond: '#101510', surface: '#1A1F1A', haute: '#242A24', filet: '#2F342E', texte: '#F2F0ED', texte2: '#AAACA7', texte3: '#757873', pleine: '#B4F044', surPleine: '#111111', encre: '#B4F044', second: '#67D8C0', accent: '#8C72FF'},
      titanium: {fond: '#171E24', surface: '#21282F', haute: '#2C3339', filet: '#373E45', texte: '#F2F0F1', texte2: '#AAABAE', texte3: '#76777A', pleine: '#4C6474', surPleine: '#FFFFFF', encre: '#7992A3', second: '#8A9DA8', accent: '#D5A24C'},
      violet: {fond: '#181427', surface: '#221E31', haute: '#2D293C', filet: '#383347', texte: '#F4EFF1', texte2: '#AEAAAF', texte3: '#79767A', pleine: '#7546DB', surPleine: '#FFFFFF', encre: '#986CFF', second: '#AC8CFA', accent: '#29BFB0'},
      forest: {fond: '#17251D', surface: '#213027', haute: '#2C3B32', filet: '#37463D', texte: '#F2F0EE', texte2: '#A9ACA8', texte3: '#757874', pleine: '#236B50', surPleine: '#FFFFFF', encre: '#5CA283', second: '#7BAC81', accent: '#D7B374'},
      solar: {fond: '#211B1A', surface: '#2C2524', haute: '#37302F', filet: '#423B39', texte: '#F7EFED', texte2: '#B4A9A7', texte3: '#7F7573', pleine: '#CA4F1C', surPleine: '#FFFFFF', encre: '#E86531', second: '#FF9760', accent: '#E8BC49'}
    };
    var a = T[this.props.accent] || T.bordeaux;
    a.vive = a.pleine; a.ink = a.encre; a.on = a.surPleine;
    var vars = '--fond: ' + a.fond + '; --surface: ' + a.surface + '; --haute: ' + a.haute + '; --filet: ' + a.filet + '; --texte: ' + a.texte + '; --texte2: ' + a.texte2 + '; --texte3: ' + a.texte3 + ';';
    var self = this;
    var base = 'all: unset; cursor: pointer; box-sizing: border-box; height: 48px; border-radius: 14px; text-align: center; font-family: Barlow Condensed, sans-serif; font-weight: 600; font-size: 22px; ';
    var rir = ['0', '1', '2', '3', '4', '5+'].map(function (l) {
      var on = self.state.picked === l;
      return {
        label: l, pressed: on ? 'true' : 'false',
        style: base + (on ? 'background: ' + a.vive + '; color: ' + a.on + ';' : 'background: var(--haute); color: var(--texte);'),
        onPick: function () { self.setState({ picked: l }); }
      };
    });
    return { a: a, rir: rir, vars: vars };
  }
}
</script>
</body>
</html>
