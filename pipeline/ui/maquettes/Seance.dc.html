<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Séance, exercice en cours</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&amp;family=Barlow+Semi+Condensed:wght@500;600&amp;family=Barlow+Condensed:wght@500;600&amp;display=swap">
<style>
body{margin:0}
a{color:var(--texte)}a:hover{color:#FFFFFF}
</style>
</helmet>
<div style="{{vars}} width: 390px; height: 844px; position: relative; overflow: hidden; background: var(--fond); color: var(--texte); font-family: 'Barlow', sans-serif; font-size: 15px; line-height: 22px; box-sizing: border-box">
  <div style="padding: 12px 20px 104px; display: flex; flex-direction: column; gap: 20px">

    <div style="display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; align-items: center; justify-content: space-between; height: 48px">
        <a href="Main.dc.html" aria-label="Quitter la séance" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; margin-left: -10px">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--texte)" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </a>
        <div style="color: var(--texte2); font-size: 14px">Exercice 3 sur 7</div>
        <button aria-label="Liste des exercices" style="all: unset; cursor: pointer; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; margin-right: -10px">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--texte)" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>
        </button>
      </div>
      <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px" role="img" aria-label="Exercice 3 sur 7">
        <div style="height: 4px; border-radius: 2px; background: var(--texte)"></div>
        <div style="height: 4px; border-radius: 2px; background: var(--texte)"></div>
        <div style="height: 4px; border-radius: 2px; background: {{a.ink}}"></div>
        <div style="height: 4px; border-radius: 2px; background: var(--filet)"></div>
        <div style="height: 4px; border-radius: 2px; background: var(--filet)"></div>
        <div style="height: 4px; border-radius: 2px; background: var(--filet)"></div>
        <div style="height: 4px; border-radius: 2px; background: var(--filet)"></div>
      </div>
    </div>

    <h1 style="margin: 0; font-family: 'Barlow Semi Condensed', sans-serif; font-weight: 600; font-size: 30px; line-height: 36px">Dips lestés</h1>

    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px">
      <div><div style="font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 30px; line-height: 34px">4 × 5</div><div style="color: var(--texte2); font-size: 13px">séries × reps</div></div>
      <div><div style="font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 30px; line-height: 34px">RIR 4</div><div style="color: var(--texte2); font-size: 13px">en réserve</div></div>
      <div><div style="font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 30px; line-height: 34px">4 min</div><div style="color: var(--texte2); font-size: 13px">de repos</div></div>
    </div>

    <section aria-label="Lest à charger" style="background: var(--surface); border-radius: 28px; padding: 18px 20px; display: flex; align-items: center; justify-content: space-between; gap: 16px">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <div style="color: var(--texte2); font-size: 14px">Lest</div>
        <div style="font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 64px; line-height: 64px; font-variant-numeric: tabular-nums; letter-spacing: -1px">+32,5<span style="font-size: 28px; margin-left: 4px; letter-spacing: 0">kg</span></div>
        <div style="color: var(--texte2); font-size: 14px">Masse totale 104 kg</div>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 6px" role="img" aria-label="Disques à charger : 25, 5 et 2,5 kg">
        <div style="position: relative; display: flex; align-items: center; gap: 3px; height: 92px">
          <div style="position: absolute; left: -10px; right: -6px; top: 44px; height: 4px; border-radius: 2px; background: var(--texte3)"></div>
          <div style="position: relative; width: 18px; height: 92px; border-radius: 4px; background: #E8E8E8"></div>
          <div style="position: relative; width: 12px; height: 60px; border-radius: 3px; background: #BDBDBD"></div>
          <div style="position: relative; width: 10px; height: 44px; border-radius: 3px; background: #8F8F8F"></div>
        </div>
        <div style="font-size: 13px; color: var(--texte2); font-variant-numeric: tabular-nums">25 + 5 + 2,5</div>
      </div>
    </section>

    <a href="Koach.dc.html" style="display: flex; align-items: center; gap: 10px; color: var(--texte); text-decoration: none; margin-top: -6px">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{a.accent}}" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M12 3c1 3.5 5 5.5 5 10a5 5 0 0 1-10 0c0-2.2 1-3.6 2.2-4.6.2 1.8 1 2.8 2 3.2C11 9 10.8 6 12 3z"/></svg>
      <span style="flex: 1">Pourquoi cette charge ?</span>
      <span style="color: var(--texte2)">2 notes</span>
    </a>

    <section aria-label="Séries" style="display: flex; flex-direction: column; gap: 6px">
      <div style="display: grid; grid-template-columns: 48px 1fr 1fr 44px; padding: 0 12px; color: var(--texte2); font-size: 13px"><span>Série</span><span>Lest</span><span>Reps</span><span></span></div>

      <div style="display: grid; grid-template-columns: 48px 1fr 1fr 44px; align-items: center; height: 52px; padding: 0 12px; border-radius: 16px; background: var(--surface); font-variant-numeric: tabular-nums">
        <span style="color: var(--texte2)">1</span><span>+32,5 kg</span><span>5 <span style="color: var(--texte2)">RIR 4</span></span>
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#5CB860" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Validée"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
      </div>

      <div style="display: grid; grid-template-columns: 48px 1fr 1fr 44px; align-items: center; gap: 8px; height: 64px; padding: 0 8px 0 12px; border-radius: 16px; background: var(--haute); box-shadow: inset 0 0 0 1.5px {{a.ink}}; font-variant-numeric: tabular-nums">
        <span style="font-weight: 600">2</span>
        <label style="display: flex; flex-direction: column"><span style="position: absolute; left: -9999px">Lest de la série 2</span><input value="+32,5" style="all: unset; height: 44px; border-radius: 12px; background: var(--fond); text-align: center; font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 22px"></label>
        <label style="display: flex; flex-direction: column"><span style="position: absolute; left: -9999px">Répétitions de la série 2</span><input value="5" style="all: unset; height: 44px; border-radius: 12px; background: var(--fond); text-align: center; font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 22px"></label>
        <span></span>
      </div>

      <div style="display: grid; grid-template-columns: 48px 1fr 1fr 44px; align-items: center; height: 52px; padding: 0 12px; color: var(--texte3); font-variant-numeric: tabular-nums"><span>3</span><span>+32,5 kg</span><span>5</span><span></span></div>
      <div style="display: grid; grid-template-columns: 48px 1fr 1fr 44px; align-items: center; height: 52px; padding: 0 12px; color: var(--texte3); font-variant-numeric: tabular-nums"><span>4</span><span>+32,5 kg</span><span>5</span><span></span></div>
    </section>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 20px 20px; background: var(--fond); border-top: 1px solid var(--filet)">
    <a href="Repos.dc.html" style="display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 16px; background: {{a.vive}}; color: {{a.on}}; font-weight: 600; font-size: 17px; text-decoration: none">Valider la série 2</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"enum","options":["bordeaux","obsidian","arctic","neon","titanium","violet","forest","solar"],"default":"bordeaux"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var T = {
      bordeaux: {fond: '#181819', surface: '#222223', haute: '#2D2C2E', filet: '#383738', texte: '#F3F0F1', texte2: '#ABABAF', texte3: '#77777A', pleine: '#873B38', surPleine: '#FFFFFF', encre: '#CA6F6A', second: '#B24B49', accent: '#D9A66C'},
      obsidian: {fond: '#121316', surface: '#1C1D20', haute: '#27272B', filet: '#313235', texte: '#F3F0F1', texte2: '#ABABAF', texte3: '#77777A', pleine: '#D73E44', surPleine: '#FFFFFF', encre: '#EA4C50', second: '#FF8566', accent: '#FFC857'},
      arctic: {fond: '#152238', surface: '#242D3D', haute: '#2F3748', filet: '#3A4354', texte: '#F3F0F1', texte2: '#ABABAF', texte3: '#77777A', pleine: '#2563EB', surPleine: '#FFFFFF', encre: '#668EFF', second: '#4F9CF9', accent: '#14B8A6'},
      neon: {fond: '#101510', surface: '#1A1F1A', haute: '#242A24', filet: '#2F342E', texte: '#F2F0ED', texte2: '#AAACA7', texte3: '#757873', pleine: '#B4F044', surPleine: '#111111', encre: '#B4F044', second: '#67D8C0', accent: '#8C72FF'},
      titanium: {fond: '#171E24', surface: '#21282F', haute: '#2C3339', filet: '#373E45', texte: '#F2F0F1', texte2: '#AAABAE', texte3: '#76777A', pleine: '#4C6474', surPleine: '#FFFFFF', encre: '#7992A3', second: '#8A9DA8', accent: '#D5A24C'},
      violet: {fond: '#181427', surface: '#221E31', haute: '#2D293C', filet: '#383347', texte: '#F4EFF1', texte2: '#AEAAAF', texte3: '#79767A', pleine: '#7546DB', surPleine: '#FFFFFF', encre: '#986CFF', second: '#AC8CFA', accent: '#29BFB0'},
      forest: {fond: '#17251D', surface: '#213027', haute: '#2C3B32', filet: '#37463D', texte: '#F2F0EE', texte2: '#A9ACA8', texte3: '#757874', pleine: '#236B50', surPleine: '#FFFFFF', encre: '#5CA283', second: '#7BAC81', accent: '#D7B374'},
      solar: {fond: '#211B1A', surface: '#2C2524', haute: '#37302F', filet: '#423B39', texte: '#F7EFED', texte2: '#B4A9A7', texte3: '#7F7573', pleine: '#CA4F1C', surPleine: '#FFFFFF', encre: '#E86531', second: '#FF9760', accent: '#E8BC49'}
    };
    var a = T[this.props.accent] || T.bordeaux;
    a.vive = a.pleine; a.ink = a.encre; a.on = a.surPleine;
    var vars = '--fond: ' + a.fond + '; --surface: ' + a.surface + '; --haute: ' + a.haute + '; --filet: ' + a.filet + '; --texte: ' + a.texte + '; --texte2: ' + a.texte2 + '; --texte3: ' + a.texte3 + ';';
    return { a: a, vars: vars };
  }
}
</script>
</body>
</html>
