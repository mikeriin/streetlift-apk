<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Réglages, après</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&amp;family=Barlow+Semi+Condensed:wght@500;600&amp;family=Barlow+Condensed:wght@500;600&amp;display=swap">
<style>
body{margin:0}
a{color:inherit}a:hover{color:inherit}
</style>
</helmet>
<div style="{{vars}} width: 390px; height: 844px; position: relative; overflow: hidden; background: var(--fond); color: var(--texte); font-family: 'Barlow', sans-serif; font-size: 15px; line-height: 22px; box-sizing: border-box">
  <div style="padding: 40px 20px 120px; display: flex; flex-direction: column; gap: 10px">

    <div style="display: flex; flex-direction: column; gap: 2px; padding: 0 4px 14px">
      <h1 style="margin: 0; font-family: 'Barlow Semi Condensed', sans-serif; font-weight: 600; font-size: 30px; line-height: 36px; text-transform: {{tt}}; letter-spacing: {{ls}}">Réglages</h1>
      <span style="color: var(--texte2)">L'application à ta façon.</span>
    </div>

    <h2 style="margin: 0; padding: 0 4px; color: var(--texte2); font-size: 14px; line-height: 20px; font-weight: 600">Apparence</h2>
    <section style="background: var(--surface); border-radius: 24px; padding: 16px; display: flex; flex-direction: column; gap: 14px">
      <div style="display: flex; flex-direction: column; gap: 8px">
        <span style="font-weight: 600">Thème</span>
        <div role="radiogroup" aria-label="Thème" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 18px; background: var(--haute)">
          <sc-for list="{{themes}}" as="t" hint-placeholder-count="3">
            <button role="radio" aria-checked="{{t.on}}" onClick="{{t.pick}}" style="{{t.style}}">{{t.label}}</button>
          </sc-for>
        </div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 8px">
        <div style="display: flex; justify-content: space-between; align-items: baseline"><span style="font-weight: 600">Palette</span><span style="color: var(--texte2); font-size: 14px">{{palName}}</span></div>
        <div role="radiogroup" aria-label="Palette" style="display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 6px">
          <sc-for list="{{swatches}}" as="s" hint-placeholder-count="8">
            <button role="radio" aria-checked="{{s.on}}" aria-label="{{s.name}}" onClick="{{s.pick}}" style="{{s.style}}"></button>
          </sc-for>
        </div>
      </div>
    </section>

    <h2 style="margin: 14px 0 0; padding: 0 4px; color: var(--texte2); font-size: 14px; line-height: 20px; font-weight: 600">Préférences</h2>
    <nav aria-label="Préférences" style="background: var(--surface); border-radius: 24px; padding: 4px 0">
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="7">
        <a href="{{r.href}}" style="display: grid; grid-template-columns: 40px 1fr 16px; gap: 14px; align-items: center; min-height: 64px; padding: 0 16px; text-decoration: none">
          <span style="width: 40px; height: 40px; border-radius: 12px; background: var(--haute); display: flex; align-items: center; justify-content: center">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--texte)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{r.icon}}"/></svg>
          </span>
          <span style="display: flex; flex-direction: column; padding: 10px 0; border-bottom: {{r.rule}}">
            <span style="font-weight: 600; font-size: 16px">{{r.title}}</span>
            <span style="color: var(--texte2); font-size: 13px; line-height: 18px">{{r.sub}}</span>
          </span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--texte2)" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
        </a>
      </sc-for>
    </nav>
  </div>

  <nav aria-label="Navigation principale" style="position: absolute; left: 16px; right: 16px; bottom: 20px; height: 64px; border-radius: 32px; background: var(--haute); box-shadow: inset 0 0 0 1px var(--filet); display: flex; align-items: center; justify-content: space-between; padding: 0 8px">
    <a href="Arsenal.dc.html" aria-label="Arsenal" style="width: 56px; height: 48px; display: flex; align-items: center; justify-content: center">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="var(--texte2)" aria-hidden="true"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/></svg>
    </a>
    <a href="#" aria-label="Stats" style="width: 56px; height: 48px; display: flex; align-items: center; justify-content: center">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--texte2)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 17l5-5 4 4 8-8"/><circle cx="20" cy="8" r="1.5"/></svg>
    </a>
    <a href="Main.dc.html" aria-label="Programme" style="width: 56px; height: 48px; display: flex; align-items: center; justify-content: center">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--texte2)" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 9v6M20 9v6M7 6v12M17 6v12M7 12h10"/></svg>
    </a>
    <a href="Reglages.dc.html" aria-current="page" style="height: 48px; padding: 0 18px; border-radius: 24px; background: {{a.pleine}}; color: {{a.surPleine}}; display: flex; align-items: center; gap: 8px; text-decoration: none; font-family: 'Barlow Semi Condensed', sans-serif; font-weight: 600; font-size: 14px; text-transform: {{tt}}; letter-spacing: {{ls}}">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>Réglages
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"palette":{"editor":"enum","options":["bordeaux","obsidian","arctic","neon","titanium","violet","forest","solar"],"default":"bordeaux"},"capitales":{"editor":"boolean","default":true},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {

      neon: {fond: '#101510', surface: '#1A1F1A', haute: '#242A24', filet: '#2F342E', texte: '#F2F0ED', texte2: '#AAACA7', texte3: '#757873', pleine: '#B4F044', surPleine: '#111111', encre: '#B4F044', second: '#67D8C0', accent: '#8C72FF'},
      titanium: {fond: '#171E24', surface: '#21282F', haute: '#2C3339', filet: '#373E45', texte: '#F2F0F1', texte2: '#AAABAE', texte3: '#76777A', pleine: '#4C6474', surPleine: '#FFFFFF', encre: '#7992A3', second: '#8A9DA8', accent: '#D5A24C'},
      violet: {fond: '#181427', surface: '#221E31', haute: '#2D293C', filet: '#383347', texte: '#F4EFF1', texte2: '#AEAAAF', texte3: '#79767A', pleine: '#7546DB', surPleine: '#FFFFFF', encre: '#986CFF', second: '#AC8CFA', accent: '#29BFB0'},

    var NAMES = { bordeaux: 'Bordeaux Performance', obsidian: 'Obsidian Energy', arctic: 'Arctic Motion', neon: 'Neon Athlete', titanium: 'Titanium Pro', violet: 'Violet Momentum', forest: 'Forest Endurance', solar: 'Solar Sprint' };
    var self = this;
    var key = this.state.pal || this.props.palette || 'bordeaux';
    var a = T[key] || T.bordeaux;
    var caps = this.props.capitales !== false;
    var vars = '--fond: ' + a.fond + '; --surface: ' + a.surface + '; --haute: ' + a.haute + '; --filet: ' + a.filet + '; --texte: ' + a.texte + '; --texte2: ' + a.texte2 + '; --texte3: ' + a.texte3 + ';';
    var seg = 'all: unset; cursor: pointer; box-sizing: border-box; height: 40px; text-align: center; font-weight: 600; font-size: 14px; ';

    var R = [
      ['Saisie des séries', 'Colonnes, effort et pré-remplissage', 'M4 6h16M4 12h10M4 18h7M17 15l3 3-3 3'],
      ['Chronomètres', 'Repos, décompte et signaux', 'M12 8v5l3 2M9 2h6M12 4a9 9 0 1 0 0 18 9 9 0 0 0 0-18z', 'ReglagesChrono.dc.html'],
      ['Progression et jeu', 'Célébrations et objectif de la semaine', 'M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z'],

    var rows = R.map(function (r, i) {
      return { title: r[0], sub: r[1], icon: r[2], href: r[3] || '#', rule: i < R.length - 1 ? '1px solid var(--filet)' : '0' };
    });
    return { a: a, vars: vars, tt: caps ? 'uppercase' : 'none', ls: caps ? '.3px' : '0', themes: themes, swatches: swatches, rows: rows, palName: NAMES[key] };
  }
}
</script>
</body>
</html>
