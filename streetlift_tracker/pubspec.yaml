name: streetlift_tracker
description: "Kalis Track — suivi d'entraînement calisthénie et streetlifting : programme guidé, séances perso, WOD, chronos, pilotage recalculable."
publish_to: 'none'
version: 4.0.1+68

environment:
  sdk: '>=3.7.0 <4.0.0'
  flutter: '>=3.29.3'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.2.3
  wakelock_plus: ^1.2.5
  audioplayers: ^6.1.0
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  fake_async: ^1.3.2
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#F4F4F4"
  adaptive_icon_foreground: "assets/icon/icon_fg.png"
  adaptive_icon_monochrome: "assets/icon/icon_fg.png"

flutter:
  uses-material-design: true
  assets:
    - assets/programme_v33.json.gz
    - assets/koach_program.json.gz
    - assets/program_models.json
    - assets/content/index.json.gz
    - assets/content/details.json.gz
    - assets/content/sources.json.gz
    - assets/content/poses.json.gz
    - assets/content/progressions.json.gz
    - assets/content/licences.md
    - assets/sounds/beep.wav
    - assets/sounds/alarm.wav
    - assets/icon/icon_fg.png
    - assets/icon/logo_mark.png
    - assets/icon/splash_flag.png
    - assets/muscles/
