name: kalis_core
description: >-
  Contrats et modèles partagés des moteurs de Kalis Track : catalogue
  d'exercices compilé, profil d'athlète v2, journal de séances, échelle des
  flammes, interfaces et types d'échange de kalis_plan, kalis_adapt et
  kalis_quest. Dart pur, sans Flutter, sans stockage, sans horloge.
version: 0.1.0
publish_to: none

environment:
  sdk: '>=3.10.0 <4.0.0'

dev_dependencies:
  crypto: ^3.0.3
  lints: ^4.0.0
  test: ^1.25.0
