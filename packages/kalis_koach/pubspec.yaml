name: kalis_koach
description: >-
  Koach, la mascotte de Kalis Track, en Dart pur : 36 poses vectorisées
  (calques encre, papier, yeux), 10 flammes de difficulté et choix
  déterministe des répliques en français.
version: 0.1.0
publish_to: none

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  meta: ^1.15.0
  collection: ^1.19.0

dev_dependencies:
  lints: ^5.1.0
  test: ^1.25.0
