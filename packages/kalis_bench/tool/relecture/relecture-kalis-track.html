<title>Relecture Kalis Track</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Carnet de coach : une colonne étroite, bandeau fixe (manche, avancement), liste des programmes puis fiche. */
:root{
  --fond:#f2f5f4; --carte:#ffffff; --encre:#14211f; --encre2:#52625f; --trait:#d5dedb;
  --accent:#0d6a5b; --accent-fond:#dff0ec; --note:#b05e00; --note-fond:#fbecd6;
  --intro:#8fb3ad; --montee:#0d6a5b; --test:#b05e00; --decharge:#b9c6c3; --alerte:#a3312b;
  --titre:"Barlow Condensed","Arial Narrow","Helvetica Neue",Arial,sans-serif;
  --texte:"Barlow","Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --fond:#101615; --carte:#19211f; --encre:#e8efed; --encre2:#9db0ac; --trait:#2c3936;
  --accent:#58c4b0; --accent-fond:#173630; --note:#f0a94a; --note-fond:#3a2a12;
  --intro:#3f6660; --montee:#58c4b0; --test:#f0a94a; --decharge:#44524f; --alerte:#f08a82; color-scheme:dark}}
:root[data-theme="dark"]{
  --fond:#101615; --carte:#19211f; --encre:#e8efed; --encre2:#9db0ac; --trait:#2c3936;
  --accent:#58c4b0; --accent-fond:#173630; --note:#f0a94a; --note-fond:#3a2a12;
  --intro:#3f6660; --montee:#58c4b0; --test:#f0a94a; --decharge:#44524f; --alerte:#f08a82; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--fond);color:var(--encre);font-family:var(--texte);font-size:16px;line-height:1.45}
.page{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:0 64px}
header.barre{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--fond);border-bottom:1px solid var(--trait);
  margin-inline:-16px;padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
header.barre h1{font-family:var(--titre);font-weight:700;font-size:22px;letter-spacing:.02em;text-transform:uppercase;margin:0;flex:1 1 auto;min-width:0}
select,button,textarea{font:inherit;color:inherit}
select{background:var(--carte);border:1px solid var(--trait);border-radius:6px;padding:6px 8px;max-width:100%}
.etat{font-size:13px;color:var(--encre2);flex:1 0 100%}
.etat.alerte{color:var(--alerte)}
h2{font-family:var(--titre);font-weight:600;font-size:26px;line-height:1.1;margin:0;text-wrap:balance}
h3{font-family:var(--titre);font-weight:600;font-size:19px;letter-spacing:.03em;text-transform:uppercase;margin:0;color:var(--encre2)}
p{margin:0}
.intro{margin-block:18px;color:var(--encre2);max-width:65ch}
.liste{display:flex;flex-direction:column;gap:8px;list-style:none;padding:0;margin:0}
.liste button{width:100%;text-align:left;background:var(--carte);border:1px solid var(--trait);border-radius:8px;padding:12px 14px;
  display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;cursor:pointer}
.liste button:hover{border-color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.liste .nom{font-weight:600;min-width:0}
.liste .sous{grid-column:1;font-size:13px;color:var(--encre2)}
.pastille{grid-row:1 / span 2;grid-column:2;font-family:var(--titre);font-weight:700;font-size:22px;min-width:52px;text-align:center;
  padding:4px 8px;border-radius:6px;background:var(--note-fond);color:var(--note);font-variant-numeric:tabular-nums}
.pastille.vide{background:transparent;border:1px dashed var(--trait);color:var(--encre2);font-size:13px;font-family:var(--texte);font-weight:500}
.groupe{margin-block:22px 8px}
.evo{margin-block:4px 18px;overflow-x:auto;border:1px solid var(--trait);border-radius:8px;background:var(--carte)}
.evo table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
.evo th,.evo td{padding:6px 8px;border-bottom:1px solid var(--trait);text-align:left;vertical-align:top}
.evo th{font-family:var(--titre);font-weight:600;letter-spacing:.03em;text-transform:uppercase;color:var(--encre2);white-space:nowrap}
.evo tr:last-child td{border-bottom:0}
.evo td:first-child{white-space:nowrap;font-weight:600}
.evo .note-evo{color:var(--encre2);font-size:13px;padding:8px;margin:0}
.retour{background:none;border:0;padding:8px 0;color:var(--accent);font-weight:600;cursor:pointer;margin-top:10px}
.fiche{display:flex;flex-direction:column;gap:22px}
.entete{display:flex;flex-direction:column;gap:6px}
.resume{color:var(--encre2);max-width:65ch}
details{border:1px solid var(--trait);border-radius:8px;background:var(--carte)}
details>summary{cursor:pointer;padding:10px 14px;font-weight:600;list-style:none;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
details>summary::-webkit-details-marker{display:none}
details>summary::before{content:"+";font-family:var(--titre);font-size:20px;color:var(--accent);width:14px;flex:none}
details[open]>summary::before{content:"–"}
details .corps{padding:0 14px 14px;display:flex;flex-direction:column;gap:10px}
.profil{margin:0;padding-left:18px;font-size:14px;color:var(--encre2)}
.profil li{margin-block:2px}
.bloc{display:flex;flex-direction:column;gap:10px}
.volume{display:flex;align-items:flex-end;gap:3px;height:96px;padding-top:6px}
.volume .col{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:2px;
  background:none;border:0;padding:0;cursor:pointer}
.volume .barre{width:100%;border-radius:3px 3px 0 0;min-height:2px}
.volume .n{font-size:10px;color:var(--encre2);font-variant-numeric:tabular-nums}
.k-introduction{background:var(--intro)} .k-montée{background:var(--montee)} .k-test{background:var(--test)} .k-décharge{background:var(--decharge)}
.legende{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--encre2)}
.legende i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px}
.faits{display:flex;gap:6px 18px;flex-wrap:wrap;font-size:14px}
.faits b{font-family:var(--titre);font-size:20px;font-weight:600;margin-right:4px;font-variant-numeric:tabular-nums}
.notation{background:var(--carte);border:1px solid var(--trait);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:14px}
.critere{display:flex;flex-direction:column;gap:6px}
.critere label,.critere .lib{font-weight:600;font-size:15px}
.critere.ensemble .lib{font-family:var(--titre);font-size:20px;text-transform:uppercase;letter-spacing:.03em}
.echelle{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.echelle button{padding:8px 0;border:1px solid var(--trait);background:var(--fond);border-radius:6px;cursor:pointer;font-weight:600;font-variant-numeric:tabular-nums}
.echelle button[aria-pressed="true"]{background:var(--note);border-color:var(--note);color:var(--carte)}
.echelle button:disabled{opacity:.5;cursor:default}
textarea{width:100%;min-height:72px;background:var(--fond);border:1px solid var(--trait);border-radius:6px;padding:8px 10px;resize:vertical}
textarea.petit{min-height:44px;font-size:14px}
.trace{font-size:12px;color:var(--encre2);min-height:16px}
.semaine .tag{font-size:12px;font-weight:600;padding:1px 7px;border-radius:10px;color:var(--carte)}
.semaine .meta{font-size:13px;color:var(--encre2);font-weight:400}
.semaine .tag.k-décharge,.semaine .tag.k-introduction{color:var(--encre)}
.seance{border-top:1px solid var(--trait);padding-top:10px;display:flex;flex-direction:column;gap:6px}
.seance h4{margin:0;font-size:15px;font-weight:600}
.seance .meta{font-size:13px;color:var(--encre2)}
.exo{display:grid;grid-template-columns:1fr auto;gap:0 10px;padding-block:5px;border-top:1px dotted var(--trait);font-size:14px}
.exo .nom{min-width:0;font-weight:500}
.exo .vol{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.exo .det{grid-column:1 / -1;color:var(--encre2);font-size:13px}
.vide{color:var(--encre2);padding:24px 0}
.md{display:flex;flex-direction:column;gap:8px;font-size:14px;min-width:0}
.md ul{margin:0;padding-left:18px}.md li{margin-block:2px}
.md .tab{overflow-x:auto;max-width:100%}
.md table{border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.md th,.md td{border-bottom:1px solid var(--trait);padding:4px 8px;text-align:left;vertical-align:top}
.md th{font-weight:600;color:var(--encre2)}
.md h4{margin:6px 0 0;font-size:15px}
.scenario{border-left:3px solid var(--note);padding-left:10px}
</style>

<div class="page">
  <header class="barre">
    <h1>Relecture Kalis Track</h1>
    <select id="manche" aria-label="Manche"></select>
    <div class="etat" id="etat">Chargement des programmes…</div>
  </header>
  <main id="vue"><p class="vide">Les programmes de la manche apparaîtront ici. Chaque note que vous donnez est enregistrée aussitôt.</p></main>
</div>

<script>
const CRITERES=[
  ["ensemble","Note d'ensemble"],
  ["adapte_au_profil","Adapté au profil"],
  ["progression","Progression"],
  ["volume_intensite","Volume et intensité"],
  ["choix_exercices","Choix des exercices"],
  ["faisable_sur","Faisable et sûr"]];
const NIVEAU={beginner:"débutant",intermediate:"intermédiaire",advanced:"avancé",elite:"élite"};
const $=(s,r=document)=>r.querySelector(s);
const el=(t,a={},...k)=>{const e=document.createElement(t);for(const[x,v]of Object.entries(a)){if(x==="class")e.className=v;else if(x==="text")e.textContent=v;else if(x.startsWith("on"))e.addEventListener(x.slice(2),v);else e.setAttribute(x,v)}for(const c of k)if(c!=null)e.append(c);return e};
let db=null,dbEtat="attente",manches=[],manche=null,courant=null,notes=new Map(),desabo=null;
const timers=new Map(),files=new Map();

function idNote(m,profil,critere){return ("m"+m+"_"+profil+"_"+critere).replace(/[^A-Za-z0-9_.~:@+-]/g,"-")}
function lire(profil,critere){return notes.get(idNote(manche.manche,profil,critere))}

// Une écriture à la fois par document : les suivantes attendent la précédente.
function ecrire(profil,critere,champs,trace){
  if(!db){if(trace)trace.textContent="Enregistrement impossible dans cette vue.";return}
  const id=idNote(manche.manche,profil,critere);
  const prec=notes.get(id)||{};
  const corps={manche:manche.manche,profil,critere,note:prec.note??null,commentaire:prec.commentaire??"",...champs,date:new Date().toISOString()};
  notes.set(id,corps);
  if(trace)trace.textContent="Enregistrement…";
  const suite=(files.get(id)||Promise.resolve()).then(()=>db.collection("notes").doc(id).set(corps))
    .then(()=>{if(trace)trace.textContent="Enregistré."},e=>{if(trace)trace.textContent="Non enregistré ("+(e&&e.code||"erreur")+"). Réessayez dans un instant."});
  files.set(id,suite);majEtat();
}
function differe(cle,f){clearTimeout(timers.get(cle));timers.set(cle,setTimeout(f,900))}

function majEtat(){
  const e=$("#etat");if(!manche)return;
  const faits=manche.programmes.filter(p=>lire(p.cle,"ensemble")?.note!=null).length;
  e.classList.toggle("alerte",dbEtat==="absent");
  e.textContent=(dbEtat==="absent"?"Notes non enregistrables dans cette vue. ":"")+faits+" programme"+(faits>1?"s":"")+" noté"+(faits>1?"s":"")+" sur "+manche.programmes.length+" · "+manche.moteurs;
}

function vueListe(garder){
  courant=null;const v=$("#vue");v.replaceChildren();
  if(manche.evolution){const e=manche.evolution,t=el("table");
    t.append(el("tr",{},...e.colonnes.map(c=>el("th",{scope:"col",text:c}))));
    for(const r of e.lignes)t.append(el("tr",{},...r.map(c=>el("td",{text:String(c)}))));
    v.append(el("h3",{class:"groupe",text:e.titre}),el("div",{class:"evo"},t,e.note?el("p",{class:"note-evo",text:e.note}):null));}
  v.append(el("p",{class:"intro",text:manche.intro||"Dix programmes créés par les moteurs pour dix profils types. Ouvrez un programme, parcourez-le, puis notez-le de 1 à 10 : une note d'ensemble, cinq critères et un commentaire libre. 9 veut dire « je le donnerais tel quel à cet athlète »."}));
  for(const[g,titre]of[["street","Street"],["autres","Autres disciplines"]]){
    const ps=manche.programmes.filter(p=>p.groupe===g);if(!ps.length)continue;
    v.append(el("h3",{class:"groupe",text:titre}));
    const ul=el("ul",{class:"liste"});
    for(const p of ps){
      const n=lire(p.cle,"ensemble")?.note;
      const nb=CRITERES.filter(c=>lire(p.cle,c[0])?.note!=null).length;
      ul.append(el("li",{},el("button",{type:"button",onclick:()=>vueFiche(p)},
        el("span",{class:"nom",text:p.titre}),
        el("span",{class:"pastille"+(n==null?" vide":""),text:n==null?"à noter":String(n)}),
        el("span",{class:"sous",text:NIVEAU[p.niveau]+" · "+p.semaines.length+" semaines"+(nb&&nb<6?" · "+nb+"/6 notes":"")}))));
    }
    v.append(ul);
  }
  if(garder!==true)scrollTo(0,0);
}

function echelle(p,code,trace){
  const box=el("div",{class:"echelle",role:"group"});
  for(let i=1;i<=10;i++){
    const b=el("button",{type:"button",id:"n-"+code+"-"+i,"aria-pressed":String(lire(p.cle,code)?.note===i),text:String(i)});
    if(dbEtat==="absent")b.disabled=true;
    b.addEventListener("click",()=>{
      const dej=lire(p.cle,code)?.note===i;
      ecrire(p.cle,code,{note:dej?null:i},trace);
      for(const x of box.children)x.setAttribute("aria-pressed",String(!dej&&x===b));
    });
    box.append(b);
  }
  return box;
}

function vueFiche(p){
  courant=p;const v=$("#vue");v.replaceChildren();
  const f=el("div",{class:"fiche"});
  f.append(el("button",{class:"retour",type:"button",onclick:vueListe,text:"← Tous les programmes"}));
  f.append(el("div",{class:"entete"},el("h2",{text:p.titre}),el("p",{class:"resume",text:p.resume})));
  const prof=el("ul",{class:"profil"});
  for(const l of p.profil)prof.append(el("li",{text:l.replace(/^\s*-\s*/,"").replace(/\*\*/g,"")}));
  f.append(el("details",{},el("summary",{text:"Fiche du profil"}),el("div",{class:"corps"},prof)));

  // Vue d'ensemble
  const max=Math.max(...p.semaines.map(s=>s.series),1);
  const seancesSem=p.semaines[0].jours.length;
  const durees=p.semaines.flatMap(s=>s.jours.map(j=>j.estime));
  const blocs=new Set(p.semaines.map(s=>s.bloc)).size;
  const vol=el("div",{class:"volume","aria-label":"Séries dures par semaine"});
  for(const s of p.semaines){
    vol.append(el("button",{class:"col",type:"button",title:"Semaine "+s.n+" : "+s.nature+", "+s.series+" séries dures",onclick:()=>{const d=$("#sem-"+s.n);d.open=true;d.scrollIntoView({block:"start"})}},
      el("span",{class:"barre k-"+s.nature,style:"height:"+Math.max(3,Math.round(78*s.series/max))+"px"}),el("span",{class:"n",text:String(s.n)})));
  }
  const natures=[...new Set(p.semaines.map(s=>s.nature))];
  f.append(el("section",{class:"bloc"},el("h3",{text:"Vue d'ensemble"}),
    el("div",{class:"faits"},
      el("span",{},el("b",{text:String(p.semaines.length)}),"semaines"),
      el("span",{},el("b",{text:String(blocs)}),blocs>1?"blocs":"bloc"),
      el("span",{},el("b",{text:String(seancesSem)}),"séances par semaine"),
      el("span",{},el("b",{text:Math.min(...durees)+"–"+Math.max(...durees)}),"min estimées par séance"),
      p.echeance?el("span",{},el("b",{text:"S"+p.echeance}),"échéance"):null),
    vol,
    el("div",{class:"legende"},...natures.map(n=>el("span",{},el("i",{class:"k-"+n}),n)),el("span",{text:"Hauteur : séries dures de la semaine (maximum "+max+")."}))));

  // Saison simulée (manches « saisons », lot CX)
  if(p.saison&&p.saison.length){
    const sa=el("section",{class:"bloc"},el("h3",{text:"Saison simulée"}),
      el("p",{class:"resume",text:"La saison telle qu'un athlète simulé l'a vécue : blocs écrits l'un après l'autre d'après les séances faites et les tests, décisions du moteur d'évolution, figures et tentatives."}));
    for(const x of p.saison)sa.append(sectionMd(x));
    f.append(sa);
  }
  if(p.scenario&&p.scenario.sections&&p.scenario.sections.length){
    const sc=el("section",{class:"bloc scenario"},el("h3",{text:"Scénario imposé"}),el("p",{class:"resume",text:p.scenario.titre}));
    for(const x of p.scenario.sections)sc.append(sectionMd(x));
    f.append(sc);
  }

  // Notation
  const nt=el("section",{class:"notation"},el("h3",{text:"Vos notes"}));
  for(const[code,lib]of CRITERES){
    const trace=el("div",{class:"trace"});
    nt.append(el("div",{class:"critere"+(code==="ensemble"?" ensemble":"")},el("div",{class:"lib",text:lib}),echelle(p,code,trace),trace));
  }
  const tr=el("div",{class:"trace"});
  const ta=el("textarea",{id:"com-"+p.cle,placeholder:"Ce qui va, ce qui ne va pas, ce que vous changeriez."});
  ta.value=lire(p.cle,"commentaire")?.commentaire||"";
  if(dbEtat==="absent")ta.disabled=true;
  ta.addEventListener("input",()=>{tr.textContent="";differe("c-"+p.cle,()=>ecrire(p.cle,"commentaire",{commentaire:ta.value},tr))});
  nt.append(el("div",{class:"critere"},el("label",{for:"com-"+p.cle,text:"Commentaire libre"}),ta,tr));
  f.append(nt);

  // Semaines
  const sem=el("section",{class:"bloc"},el("h3",{text:"Semaines et séances"}));
  for(const s of p.semaines){
    const d=el("details",{class:"semaine",id:"sem-"+s.n},
      el("summary",{},"Semaine "+s.n,el("span",{class:"tag k-"+s.nature,text:s.nature}),
        el("span",{class:"meta",text:"bloc "+s.bloc+" · "+s.series+" séries dures"})));
    const corps=el("div",{class:"corps"});
    d.addEventListener("toggle",()=>{if(d.open&&!corps.childElementCount)remplir(p,s,corps)});
    d.append(corps);sem.append(d);
  }
  f.append(sem);
  f.append(el("button",{class:"retour",type:"button",onclick:vueListe,text:"← Tous les programmes"}));
  v.append(f);scrollTo(0,0);
}

function enLigne(t){
  const e=el("span");const re=/\*\*([^*]+)\*\*|`([^`]+)`/g;let i=0,m;
  while((m=re.exec(t))){if(m.index>i)e.append(t.slice(i,m.index));e.append(m[1]!=null?el("b",{text:m[1]}):el("code",{text:m[2]}));i=re.lastIndex}
  if(i<t.length)e.append(t.slice(i));return e;
}
function rendreMd(texte){
  const box=el("div",{class:"md"});const L=texte.split("\n");let i=0;
  const cells=l=>l.trim().replace(/^\|/,"").replace(/\|$/,"").split("|").map(c=>c.trim());
  while(i<L.length){
    const l=L[i];
    if(!l.trim()){i++;continue}
    if(l.trim().startsWith("|")){
      const rows=[];while(i<L.length&&L[i].trim().startsWith("|")){rows.push(L[i]);i++}
      const t=el("table");const head=cells(rows[0]);
      const tr=el("tr");for(const c of head)tr.append(el("th",{},enLigne(c)));t.append(el("thead",{},tr));
      const tb=el("tbody");
      for(const r of rows.slice(1)){if(/^\s*\|?\s*:?-{2,}/.test(r))continue;const x=el("tr");for(const c of cells(r))x.append(el("td",{},enLigne(c)));tb.append(x)}
      t.append(tb);box.append(el("div",{class:"tab"},t));continue;
    }
    if(/^\s*[-*] /.test(l)){
      const ul=el("ul");while(i<L.length&&/^\s*[-*] /.test(L[i])){ul.append(el("li",{},enLigne(L[i].replace(/^\s*[-*] /,""))));i++}
      box.append(ul);continue;
    }
    const h=l.match(/^#{3,6}\s+(.*)$/);
    if(h){box.append(el("h4",{},enLigne(h[1])));i++;continue}
    const par=[];while(i<L.length&&L[i].trim()&&!L[i].trim().startsWith("|")&&!/^\s*[-*] /.test(L[i])&&!/^#{3,6}\s/.test(L[i])){par.push(L[i].trim());i++}
    box.append(el("p",{},enLigne(par.join(" "))));
  }
  return box;
}
function sectionMd(x){
  const corps=el("div",{class:"corps"});
  const d=el("details",{},el("summary",{text:x.titre}),corps);
  d.addEventListener("toggle",()=>{if(d.open&&!corps.childElementCount)corps.append(rendreMd(x.texte))});
  return d;
}

function remplir(p,s,corps){
  for(const j of s.jours){
    const b=el("div",{class:"seance"},el("h4",{text:j.jour[0].toUpperCase()+j.jour.slice(1)+" — "+j.theme}),
      el("div",{class:"meta",text:"environ "+j.estime+" min"+(j.minutes?" (créneau de "+j.minutes+" min)":"")}));
    for(const[nom,volume,charge,effort,repos,notes_]of j.items){
      const det=[charge&&charge!=="—"?charge:null,effort&&effort!=="—"?effort:null,repos?"repos "+repos+" s":null,notes_||null].filter(Boolean).join(" · ");
      b.append(el("div",{class:"exo"},el("span",{class:"nom",text:nom}),el("span",{class:"vol",text:volume}),el("span",{class:"det",text:det})));
    }
    const code="seance_S"+s.n+"_"+j.jour;
    const tr=el("div",{class:"trace"});
    const ta=el("textarea",{class:"petit",id:"cs-"+p.cle+"-"+s.n+"-"+j.jour,placeholder:"Commentaire sur cette séance (facultatif)","aria-label":"Commentaire sur la séance du "+j.jour+", semaine "+s.n});
    ta.value=lire(p.cle,code)?.commentaire||"";
    if(dbEtat==="absent")ta.disabled=true;
    ta.addEventListener("input",()=>{tr.textContent="";differe(code+p.cle,()=>ecrire(p.cle,code,{commentaire:ta.value},tr))});
    b.append(ta,tr);corps.append(b);
  }
}

async function chargerManche(m){
  $("#etat").textContent="Chargement des programmes…";
  const r=await fetch(m.fichier);manche=await r.json();
  majEtat();vueListe();
}

async function demarrer(){
  try{
    const r=await fetch("manches/index.json");manches=(await r.json()).manches;
    const sel=$("#manche");
    for(const m of manches)sel.append(el("option",{value:String(m.id),text:m.titre+" — "+m.sous_titre}));
    sel.value=String(manches[manches.length-1].id);
    sel.addEventListener("change",()=>chargerManche(manches.find(m=>String(m.id)===sel.value)));
    await chargerManche(manches[manches.length-1]);
  }catch(e){
    $("#etat").textContent="Les programmes n'ont pas pu être chargés. Rechargez la page.";$("#etat").classList.add("alerte");return;
  }
  db=await (window.claude?.use?window.claude.use("db"):Promise.resolve(null));
  if(!db){dbEtat="absent";majEtat();if(courant)vueFiche(courant);else vueListe();return}
  dbEtat="pret";
  desabo=db.collection("notes").onSnapshot(snap=>{
    let premier=notes.size===0;
    for(const d of snap.docs){const id=d.id;if(!files.has(id)||premier)notes.set(id,{...d.data()})}
    majEtat();
    if(!courant)vueListe(true);else if(premier)vueFiche(courant);
  },e=>{dbEtat="absent";majEtat()});
}
demarrer();
</script>
