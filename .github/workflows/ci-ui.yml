# Pipeline « Refonte UI et UX » (UI) : contrôle complet d'un lot, déclenché
# par un push sur claude/ci-ui-<lot> (ui0, ui1…). Copie de ci-3d.yml (M1 à
# CI1g), avec, en plus (cahier UI §6, PIPELINE_UI.md §3) :
# - une concurrence par branche : UI1 à UI4 contrôlent en parallèle ;
# - le contrôle des jetons (tools/check_ui_tokens.py : relevé complet non
#   bloquant, zone du lot bloquante dans checks.txt) ;
# - les captures du kit et des écrans (test/ui*_capture_test.dart) ;
# - le tour de captures et le relevé des parcours sur émulateur
#   (integration_test/tour_ui_test.dart), sur le lot (« après ») et sur
#   main b7996b3f, base de la refonte (« avant ») ;
# - les cibles émulateur des lots précédents (tools/ci3d_drive.sh).
# Suffixe « -rapide » (claude/ci-ui-ui1-rapide) : formatage, analyse, tests
# du lot (test/<lot>_*_test.dart) et captures seulement, sans build ni
# émulateur. Les résultats sont recommités dans ci-out/ sur la même
# branche : rien à télécharger.
name: CI UI (refonte)

on:
  push:
    branches: ["claude/ci-ui-*"]
    paths-ignore:
      - "ci-out/**"

permissions:
  contents: write

concurrency:
  group: ci-ui-${{ github.ref_name }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.5"
  # Base de la refonte (main dev6.11.1) : rendus et parcours « avant ».
  UI_BASE: "b7996b3f85822350924d9516df002b26bba03806"

jobs:
  checks:
    name: Contrôles, tests et build debug
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Lot et mode
        id: lot
        run: |
          name="${GITHUB_REF_NAME#claude/ci-ui-}"
          rapide=false
          case "$name" in *-rapide) rapide=true; name="${name%-rapide}";; esac
          lot=$(echo "$name" | tr '[:lower:]' '[:upper:]')
          echo "lot=$lot" >> "$GITHUB_OUTPUT"
          echo "low=$name" >> "$GITHUB_OUTPUT"
          echo "rapide=$rapide" >> "$GITHUB_OUTPUT"
          mkdir -p out
          echo "lot=$lot rapide=$rapide" | tee out/lot.txt
      - name: Déchiffrer les ressources sous licence (M6c)
        env:
          KT_ASSETS_KEY: ${{ secrets.KT_ASSETS_KEY }}
        run: python3 tools/secure_assets.py decrypt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Préparer le projet
        run: |
          test -f pubspec.yaml
          flutter --version > out/flutter-version.txt 2>&1
          cat out/flutter-version.txt
      - name: Composants Android
        if: steps.lot.outputs.rapide != 'true'
        run: |
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          tools="$sdk/cmdline-tools/latest/bin"
          (yes 2>/dev/null || true) | "$tools/sdkmanager" --licenses > /dev/null
          "$tools/sdkmanager" --install "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" > out/sdkmanager.log 2>&1 || { tail -n 40 out/sdkmanager.log; exit 1; }
      - name: Dépendances (verrou régénéré si absent ou périmé)
        id: pub
        run: |
          if flutter pub get --enforce-lockfile > out/pub-get.log 2>&1; then
            echo "verrou=respecte" | tee out/pub-lock.txt
          else
            echo "verrou=regenere" | tee out/pub-lock.txt
            flutter pub get >> out/pub-get.log 2>&1
          fi
          cp pubspec.lock out/pubspec.lock
          git diff -- . ':(exclude)pubspec.lock' > out/migrations-pub.patch
      - name: Formatage
        id: format
        continue-on-error: true
        run: |
          set -o pipefail
          if ! dart format --output=none --set-exit-if-changed lib test integration_test test_driver > out/format.log 2>&1; then
            dart format lib test integration_test test_driver > /dev/null 2>&1 || true
            git diff -- lib test integration_test test_driver > out/format.patch
            head -n 300 out/format.patch
            git checkout -q -- lib test integration_test test_driver
            exit 1
          fi
      - name: Analyse
        id: analyze
        continue-on-error: true
        run: |
          set -o pipefail
          flutter analyze --no-pub 2>&1 | tee out/analyze.log
      - name: Jetons UI (cahier §6.1)
        id: tokens
        continue-on-error: true
        run: |
          set -o pipefail
          python3 tools/check_ui_tokens.py --menus --baseline out/ui-tokens.json > out/ui-tokens.txt 2>&1 || true
          cat out/ui-tokens.txt
          python3 tools/check_ui_tokens.py --zone "${{ steps.lot.outputs.lot }}" --menus 2>&1 | tee out/ui-tokens-zone.txt
      - name: Tests Python et intégrité
        id: python
        if: steps.lot.outputs.rapide != 'true'
        continue-on-error: true
        run: |
          set -o pipefail
          python3 -m unittest discover -s tools/tests -v > out/python-tests.log 2>&1
          python3 tools/verify_project.py | tee -a out/python-tests.log
          python3 tools/package_release.py --check | tee -a out/python-tests.log
          python3 tools/check_release_without_secrets.py --tree | tee -a out/python-tests.log
          python3 tools/secure_assets.py check | tee -a out/python-tests.log
      - name: Tests Dart
        id: dart
        continue-on-error: true
        run: |
          set -o pipefail
          if [ "${{ steps.lot.outputs.rapide }}" = true ]; then
            files=$(ls test/${{ steps.lot.outputs.low }}_*_test.dart 2>/dev/null | grep -v '_capture_test.dart' || true)
          else
            files=""
          fi
          TZ=Europe/Paris flutter test --no-pub --timeout 60s --reporter expanded $files > out/flutter-tests.log 2>&1 || {
            grep -E -A12 'EXCEPTION CAUGHT|\[E\]$' out/flutter-tests.log | head -n 200
            tail -n 8 out/flutter-tests.log
            exit 1
          }
          tail -n 5 out/flutter-tests.log
      - name: Tests Dart du mode dev (KALIS_DEV=true)
        id: dartdev
        if: steps.lot.outputs.rapide != 'true'
        continue-on-error: true
        run: |
          set -o pipefail
          TZ=Europe/Paris flutter test --no-pub --timeout 60s --reporter expanded \
            --dart-define=KALIS_DEV=true test/g1_mode_dev_test.dart test/g2_mode_dev_test.dart test/g3_mode_dev_test.dart test/g6_mode_dev_test.dart test/g7_mode_dev_test.dart test/g10_mode_dev_test.dart > out/flutter-tests-dev.log 2>&1 || {
            grep -E -A12 'EXCEPTION CAUGHT|\[E\]$' out/flutter-tests-dev.log | head -n 200
            tail -n 8 out/flutter-tests-dev.log
            exit 1
          }
          tail -n 5 out/flutter-tests-dev.log
      - name: Captures UI (kit et écrans, après)
        id: uicaptures
        continue-on-error: true
        run: |
          touch marker-ui
          files=$(ls test/ui*_capture_test.dart 2>/dev/null || true)
          status=0
          if [ -n "$files" ]; then
            TZ=Europe/Paris flutter test --no-pub --timeout 600s --dart-define=KALIS_CAPTURE=true \
              $files > out/captures-ui.log 2>&1 || status=$?
          fi
          mkdir -p captures-ui
          find . -name '*.png' -newer marker-ui -not -path './build/*' -not -path './captures-ui/*' | while read -r f; do
            cp "$f" "captures-ui/$(basename "$f")"
          done
          ls captures-ui | wc -l
          tail -n 5 out/captures-ui.log 2>/dev/null || true
          exit "$status"
      - name: Rendus de test historiques (après)
        id: captures
        if: steps.lot.outputs.rapide != 'true'
        continue-on-error: true
        run: |
          touch marker
          status=0
          TZ=Europe/Paris flutter test --no-pub --timeout 300s --dart-define=KALIS_CAPTURE=true \
            test/visual_capture_test.dart test/l5c_ecrans_capture_test.dart > out/captures-apres.log 2>&1 || status=$?
          mkdir -p captures-apres
          find . -name '*.png' -newer marker -not -path './build/*' -not -path './captures-apres/*' -not -path './captures-ui/*' | while read -r f; do
            cp "$f" "captures-apres/$(echo "${f#./}" | tr '/' '_')"
          done
          ls captures-apres | wc -l
          exit "$status"
      - name: Build debug
        id: build
        if: steps.lot.outputs.rapide != 'true'
        continue-on-error: true
        run: |
          set -o pipefail
          flutter build apk --debug --no-pub > out/build-debug.log 2>&1
          ls -la build/app/outputs/flutter-apk/ | tee -a out/build-debug.log
      - name: Build profile (poids de l'APK)
        id: profile
        if: steps.lot.outputs.rapide != 'true'
        continue-on-error: true
        run: |
          set -o pipefail
          flutter build apk --profile --no-pub > out/build-profile.log 2>&1
          ls -la build/app/outputs/flutter-apk/ | tee -a out/build-profile.log
          python3 - <<'PY' > out/apk-poids.txt
          import zipfile, collections
          z = zipfile.ZipFile('build/app/outputs/flutter-apk/app-profile.apk')
          groups = collections.Counter()
          files = []
          for i in z.infolist():
              parts = i.filename.split('/')
              key = '/'.join(parts[:4]) if parts[0] == 'assets' else '/'.join(parts[:2])
              groups[key] += i.compress_size
              files.append((i.compress_size, i.file_size, i.filename))
          print('Total compressé :', sum(groups.values()))
          for k, v in groups.most_common(40):
              print(f'{v:>12}  {k}')
          print()
          for c, u, n in sorted(files, reverse=True)[:60]:
              print(f'{c:>12} {u:>12}  {n}')
          PY
          head -n 40 out/apk-poids.txt
      - name: Bilan
        if: always()
        run: |
          {
            echo "lot=${{ steps.lot.outputs.lot }}"
            echo "rapide=${{ steps.lot.outputs.rapide }}"
            echo "pub=${{ steps.pub.outcome }}"
            echo "format=${{ steps.format.outcome }}"
            echo "analyze=${{ steps.analyze.outcome }}"
            echo "ui_tokens_zone=${{ steps.tokens.outcome }}"
            echo "python=${{ steps.python.outcome }}"
            echo "dart=${{ steps.dart.outcome }}"
            echo "dart_dev=${{ steps.dartdev.outcome }}"
            echo "captures_ui=${{ steps.uicaptures.outcome }}"
            echo "captures=${{ steps.captures.outcome }}"
            echo "build_debug=${{ steps.build.outcome }}"
            echo "build_profile=${{ steps.profile.outcome }}"
          } > out/checks.txt
          cat out/checks.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checks
          path: out/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: captures-ui
          path: captures-ui/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: captures-apres
          path: captures-apres/
          if-no-files-found: ignore

  packages:
    name: Paquets Dart (moteurs)
    if: ${{ !endsWith(github.ref_name, '-rapide') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Contrôler chaque paquet
        run: |
          set -o pipefail
          mkdir -p out-packages
          bilan=out-packages/packages.txt
          : > "$bilan"
          status=0
          found=0
          root=$PWD
          for dir in packages/*/; do
            [ -f "${dir}pubspec.yaml" ] || continue
            found=1
            name=$(basename "$dir")
            log="$root/out-packages/$name.log"
            mkdir -p "out-packages/$name"
            echo "== $name" | tee "$log"
            ok=1
            (cd "$dir" && dart pub get) >> "$log" 2>&1 || ok=0
            (cd "$dir" && dart format --output=none --set-exit-if-changed .) >> "$log" 2>&1 || { echo "formatage : échec" >> "$log"; ok=0; }
            (cd "$dir" && dart analyze --fatal-infos) >> "$log" 2>&1 || { echo "analyse : échec" >> "$log"; ok=0; }
            (cd "$dir" && dart test --reporter expanded) >> "$log" 2>&1 || { echo "tests : échec" >> "$log"; ok=0; }
            if [ "$ok" = 1 ]; then echo "$name=success" >> "$bilan"; else echo "$name=failure" >> "$bilan"; status=1; fi
            tail -n 30 "$log"
          done
          if [ "$found" = 0 ]; then echo "aucun paquet" | tee -a "$bilan"; fi
          cat "$bilan"
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: packages
          path: out-packages/
          if-no-files-found: warn

  before:
    name: Rendus de test de référence (base b7996b3f)
    if: ${{ !endsWith(github.ref_name, '-rapide') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Projet de la base
        run: |
          git fetch -q --depth 1 origin "$UI_BASE"
          mkdir -p avant
          git archive FETCH_HEAD | tar -x -C avant
          test -f avant/pubspec.yaml
      - name: Déchiffrer les ressources sous licence de la base
        env:
          KT_ASSETS_KEY: ${{ secrets.KT_ASSETS_KEY }}
        run: (cd avant && python3 tools/secure_assets.py decrypt)
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Rendus (avant)
        working-directory: avant
        run: |
          flutter pub get --enforce-lockfile > /dev/null
          touch ../marker
          TZ=Europe/Paris flutter test --no-pub --timeout 300s --dart-define=KALIS_CAPTURE=true \
            test/visual_capture_test.dart test/l5c_ecrans_capture_test.dart > ../captures-avant.log 2>&1 || true
          mkdir -p ../captures-avant
          find . -name '*.png' -newer ../marker -not -path './build/*' | while read -r f; do
            cp "$f" "../captures-avant/$(echo "${f#./}" | tr '/' '_')"
          done
          cp ../captures-avant.log ../captures-avant/
          ls ../captures-avant | wc -l
      - uses: actions/upload-artifact@v4
        with:
          name: captures-avant
          path: captures-avant/

  tour:
    # Tour de captures et relevé des parcours (cahier UI §6.2, §6.3) : sur
    # le lot (« apres ») et sur la base b7996b3f (« avant »), même test
    # (integration_test/tour_ui_test.dart du lot, posé sur la base).
    name: Tour UI sur émulateur (${{ matrix.cote }})
    if: ${{ !endsWith(github.ref_name, '-rapide') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        cote: [apres, avant]
    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false
    defaults:
      run:
        shell: bash
    steps:
      - name: Libérer de l'espace disque
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost \
            /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/share/powershell \
            /opt/microsoft /usr/local/share/chromium /opt/az /usr/share/miniconda || true
          sdk="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          for d in "$sdk"/ndk/*; do
            [ "$(basename "$d")" = "28.2.13676358" ] || sudo rm -rf "$d"
          done
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          df -h / | tail -1
      - uses: actions/checkout@v4
      - name: Projet (base pour « avant »)
        run: |
          if [ "${{ matrix.cote }}" = avant ]; then
            git fetch -q --depth 1 origin "$UI_BASE"
            mkdir -p /tmp/base
            git archive FETCH_HEAD | tar -x -C /tmp/base
            cp integration_test/tour_ui_test.dart /tmp/base/integration_test/
            cp tools/ci_ui_drive.sh /tmp/base/tools/
            # Le tour lu sur la base : mêmes écrans, mêmes parcours.
            rm -rf ./* && cp -a /tmp/base/. .
          fi
          test -f integration_test/tour_ui_test.dart
      - name: Déchiffrer les ressources sous licence (M6c)
        env:
          KT_ASSETS_KEY: ${{ secrets.KT_ASSETS_KEY }}
        run: python3 tools/secure_assets.py decrypt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Installer les composants
        run: |
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          tools="$sdk/cmdline-tools/latest/bin"
          (yes 2>/dev/null || true) | "$tools/sdkmanager" --licenses > /dev/null
          "$tools/sdkmanager" --install "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" > /dev/null
          flutter pub get --enforce-lockfile || flutter pub get
          mkdir -p build/ci3d
          flutter pub add 'dev:integration_test:{"sdk":"flutter"}' > build/ci3d/pub-add.log 2>&1
          flutter analyze --no-pub integration_test/tour_ui_test.dart --no-fatal-infos 2>&1 | tee build/ci3d/analyze-tour.log
      - name: Activer KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Précompiler l'APK du tour
        run: flutter build apk --debug --no-pub --dart-define=KALIS_DEV=true --target=integration_test/tour_ui_test.dart > build/ci3d/build-tour.log 2>&1 || (tail -n 60 build/ci3d/build-tour.log; exit 1)
      - name: Tour sur émulateur
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-build: 13823996
          emulator-options: -no-window -gpu swangle_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: UI_TOUR_COTE=${{ matrix.cote }} bash tools/ci_ui_drive.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tour-${{ matrix.cote }}
          path: build/ci3d/
          if-no-files-found: warn

  emulator:
    # Cibles émulateur des lots précédents (CI1g … M1), inchangées : aucune
    # régression de parcours après la refonte.
    name: Cibles émulateur précédentes (ci3d_drive.sh)
    if: ${{ !endsWith(github.ref_name, '-rapide') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false
    defaults:
      run:
        shell: bash
    steps:
      - name: Libérer de l'espace disque
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost \
            /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/share/powershell \
            /opt/microsoft /usr/local/share/chromium /opt/az /usr/share/miniconda || true
          sdk="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          for d in "$sdk"/ndk/*; do
            [ "$(basename "$d")" = "28.2.13676358" ] || sudo rm -rf "$d"
          done
          sudo docker image prune --all --force > /dev/null 2>&1 || true
      - uses: actions/checkout@v4
      - name: Déchiffrer les ressources sous licence (M6c)
        env:
          KT_ASSETS_KEY: ${{ secrets.KT_ASSETS_KEY }}
        run: python3 tools/secure_assets.py decrypt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Installer les composants
        run: |
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          tools="$sdk/cmdline-tools/latest/bin"
          (yes 2>/dev/null || true) | "$tools/sdkmanager" --licenses > /dev/null
          "$tools/sdkmanager" --install "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" > /dev/null
          flutter pub get --enforce-lockfile || flutter pub get
          mkdir -p build/ci3d
          flutter pub add 'dev:integration_test:{"sdk":"flutter"}' > build/ci3d/pub-add.log 2>&1
          flutter analyze --no-pub integration_test test_driver --no-fatal-infos 2>&1 | tee build/ci3d/analyze-integration.log
          grep -q "No issues found" build/ci3d/analyze-integration.log
      - name: Activer KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Précompiler l'APK de test
        run: flutter build apk --debug --no-pub --dart-define=KALIS_DEV=true --target=integration_test/clearance_ci1g_test.dart > build/ci3d/build-test.log 2>&1 || (tail -n 60 build/ci3d/build-test.log; exit 1)
      - name: Rendu sur émulateur
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-build: 13823996
          emulator-options: -no-window -gpu swangle_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash tools/ci3d_drive.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulateur
          path: build/ci3d/
          if-no-files-found: warn

  publish:
    name: Publier les résultats dans ci-out/
    needs: [checks, packages, before, tour, emulator]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Assembler ci-out
        run: |
          rm -rf ci-out && mkdir -p ci-out
          cp -r artifacts/checks/. ci-out/ 2>/dev/null || true
          mkdir -p ci-out/packages && cp -r artifacts/packages/. ci-out/packages/ 2>/dev/null || true
          mkdir -p ci-out/emulateur && cp -r artifacts/emulateur/. ci-out/emulateur/ 2>/dev/null || true
          mkdir -p ci-out/tour/apres ci-out/tour/avant
          cp -r artifacts/tour-apres/. ci-out/tour/apres/ 2>/dev/null || true
          cp -r artifacts/tour-avant/. ci-out/tour/avant/ 2>/dev/null || true
          mkdir -p ci-out/captures-ui && cp -r artifacts/captures-ui/. ci-out/captures-ui/ 2>/dev/null || true
          cp artifacts/captures-avant/captures-avant.log ci-out/ 2>/dev/null || true
          pip install --quiet pillow
          if [ -d artifacts/captures-avant ] && [ -d artifacts/captures-apres ]; then
            python3 tools/compare_renders.py artifacts/captures-avant artifacts/captures-apres > ci-out/captures-comparaison.txt 2>&1 || true
            mkdir -p ci-out/captures
            { grep -E '^\S+\.png' ci-out/captures-comparaison.txt || true; } | { grep 'pixels différents' || true; } | sort -t$'\t' -k2 -n -r | awk '{print $1}' | head -n 16 | while read -r n; do
              cp "artifacts/captures-avant/$n" "ci-out/captures/avant_$n" 2>/dev/null || true
              cp "artifacts/captures-apres/$n" "ci-out/captures/apres_$n" 2>/dev/null || true
            done
          fi
          {
            echo "run=${{ github.run_id }}"
            echo "commit=${{ github.sha }}"
            echo "checks=${{ needs.checks.result }}"
            echo "packages=${{ needs.packages.result }}"
            echo "before=${{ needs.before.result }}"
            echo "tour=${{ needs.tour.result }}"
            echo "emulator=${{ needs.emulator.result }}"
          } > ci-out/resultat.txt
          cat ci-out/resultat.txt
          du -sh ci-out
      - name: Recommiter ci-out sur la branche
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3; do
            git fetch -q origin "$GITHUB_REF_NAME"
            git reset -q FETCH_HEAD
            git add -A -f ci-out
            git commit -qm "CI UI : résultats du run ${{ github.run_id }}" || exit 0
            git push -q origin "HEAD:$GITHUB_REF_NAME" && break
            sleep 5
          done
