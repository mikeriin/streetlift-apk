# Pipeline « Mannequin 3D » (M1) : contrôles, captures et rendu réel sur
# émulateur Android, déclenchés uniquement par un push sur claude/ci-3d.
# Les résultats (journaux, captures, relevé des temps d'image) sont
# recommités par la CI dans ci-out/ sur la même branche : rien à
# télécharger. Méthode : docs/CI_3D.md.
# M4c (5.3.2) : le projet est à la racine du dépôt (plus d'extraction) ;
# rendus de référence « avant » pris sur main (commit parent du lot), que
# main soit encore livré en ZIP (5.3.1) ou en sources.
name: CI 3D (mannequin)

on:
  push:
    branches: ["claude/ci-3d"]
    paths-ignore:
      - "ci-out/**"

permissions:
  contents: write

concurrency:
  group: ci-3d
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.5"
  # Version Flutter de main (rendus de test de référence du lot).
  FLUTTER_BEFORE: "3.47.5"

jobs:
  checks:
    name: Contrôles, tests et build debug
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Déchiffrer les ressources sous licence (M6c)
        env:
          KT_ASSETS_KEY: ${{ secrets.KT_ASSETS_KEY }}
        run: python3 tools/secure_assets.py decrypt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Préparer le projet (racine du dépôt)
        run: |
          test -f pubspec.yaml && test ! -e streetlift_tracker_v33.zip
          mkdir -p out
          flutter --version > out/flutter-version.txt 2>&1
          dart --version >> out/flutter-version.txt 2>&1
          cat out/flutter-version.txt
      - name: Composants Android
        run: |
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          tools="$sdk/cmdline-tools/latest/bin"
          (yes 2>/dev/null || true) | "$tools/sdkmanager" --licenses > /dev/null
          "$tools/sdkmanager" --install "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" > out/sdkmanager.log 2>&1 || { tail -n 40 out/sdkmanager.log; exit 1; }
      - name: Dépendances (verrou régénéré si absent ou périmé)
        id: pub
        run: |
          if flutter pub get --enforce-lockfile > out/pub-get.log 2>&1; then
            echo "verrou=respecte" | tee out/pub-lock.txt
          else
            echo "verrou=regenere" | tee out/pub-lock.txt
            flutter pub get >> out/pub-get.log 2>&1
          fi
          cp pubspec.lock out/pubspec.lock
          # Migrations automatiques de l'outil Flutter (à reporter dans les sources).
          git diff -- . ':(exclude)pubspec.lock' > out/migrations-pub.patch
          flutter pub outdated > out/pub-outdated.txt 2>&1 || true
          flutter pub deps --style=compact > out/pub-deps.txt 2>&1 || true
      - name: Formatage
        id: format
        continue-on-error: true
        run: |
          set -o pipefail
          if ! dart format --output=none --set-exit-if-changed lib test integration_test test_driver > out/format.log 2>&1; then
            # Correctif prêt à appliquer (tout le code, y compris
            # integration_test et test_driver).
            dart format lib test integration_test test_driver > /dev/null 2>&1 || true
            git diff -- lib test integration_test test_driver > out/format.patch
            head -n 300 out/format.patch
            git checkout -q -- lib test integration_test test_driver
            exit 1
          fi
      - name: Analyse
        id: analyze
        continue-on-error: true
        run: |
          set -o pipefail
          flutter analyze --no-pub 2>&1 | tee out/analyze.log
      - name: Tests Python et intégrité
        id: python
        continue-on-error: true
        run: |
          set -o pipefail
          python3 -m unittest discover -s tools/tests -v > out/python-tests.log 2>&1
          python3 tools/verify_project.py | tee -a out/python-tests.log
          python3 tools/package_release.py --check | tee -a out/python-tests.log
          python3 tools/check_release_without_secrets.py --tree | tee -a out/python-tests.log
          python3 tools/secure_assets.py check | tee -a out/python-tests.log
      - name: Tests Dart
        id: dart
        continue-on-error: true
        run: |
          set -o pipefail
          # Échecs recopiés dans le journal du job (lisible même si l'envoi
          # des artefacts échoue).
          TZ=Europe/Paris flutter test --no-pub --timeout 60s --reporter expanded > out/flutter-tests.log 2>&1 || {
            grep -E -A12 'EXCEPTION CAUGHT|\[E\]$' out/flutter-tests.log | head -n 200
            tail -n 8 out/flutter-tests.log
            exit 1
          }
          tail -n 5 out/flutter-tests.log
      - name: Tests Dart du mode dev (G1, G2, G3, G6, KALIS_DEV=true)
        id: dartdev
        continue-on-error: true
        run: |
          set -o pipefail
          TZ=Europe/Paris flutter test --no-pub --timeout 60s --reporter expanded \
            --dart-define=KALIS_DEV=true test/g1_mode_dev_test.dart test/g2_mode_dev_test.dart test/g3_mode_dev_test.dart test/g6_mode_dev_test.dart > out/flutter-tests-dev.log 2>&1 || {
            grep -E -A12 'EXCEPTION CAUGHT|\[E\]$' out/flutter-tests-dev.log | head -n 200
            tail -n 8 out/flutter-tests-dev.log
            exit 1
          }
          tail -n 5 out/flutter-tests-dev.log
      - name: Rendus de test (après)
        id: captures
        continue-on-error: true
        run: |
          touch marker
          status=0
          TZ=Europe/Paris flutter test --no-pub --timeout 300s --dart-define=KALIS_CAPTURE=true \
            test/visual_capture_test.dart test/l5c_ecrans_capture_test.dart > out/captures-apres.log 2>&1 || status=$?
          mkdir -p captures-apres
          find . -name '*.png' -newer marker -not -path './build/*' -not -path './captures-apres/*' | while read -r f; do
            cp "$f" "captures-apres/$(echo "${f#./}" | tr '/' '_')"
          done
          ls captures-apres | wc -l
          exit "$status"
      - name: Build debug
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          flutter build apk --debug --no-pub > out/build-debug.log 2>&1
          ls -la build/app/outputs/flutter-apk/ | tee -a out/build-debug.log
      - name: Build profile (plugins comme en release, sans signature)
        id: profile
        continue-on-error: true
        run: |
          set -o pipefail
          flutter build apk --profile --no-pub > out/build-profile.log 2>&1
          ls -la build/app/outputs/flutter-apk/ | tee -a out/build-profile.log
          # Poids : contenu de l'APK regroupé par dossier (octets compressés).
          python3 - <<'PY' > out/apk-poids.txt
          import zipfile, collections
          z = zipfile.ZipFile('build/app/outputs/flutter-apk/app-profile.apk')
          groups = collections.Counter()
          files = []
          for i in z.infolist():
              parts = i.filename.split('/')
              key = '/'.join(parts[:4]) if parts[0] == 'assets' else '/'.join(parts[:2])
              groups[key] += i.compress_size
              files.append((i.compress_size, i.file_size, i.filename))
          print('Total compressé :', sum(groups.values()))
          for k, v in groups.most_common(40):
              print(f'{v:>12}  {k}')
          print()
          for c, u, n in sorted(files, reverse=True)[:60]:
              print(f'{c:>12} {u:>12}  {n}')
          PY
          head -n 40 out/apk-poids.txt
      - name: Migrations de l'outil Flutter pendant le build
        if: always()
        run: git diff -- android analysis_options.yaml > out/migrations-build.patch || true
      - name: Bilan
        if: always()
        run: |
          {
            echo "pub=${{ steps.pub.outcome }}"
            echo "format=${{ steps.format.outcome }}"
            echo "analyze=${{ steps.analyze.outcome }}"
            echo "python=${{ steps.python.outcome }}"
            echo "dart=${{ steps.dart.outcome }}"
            echo "dart_dev=${{ steps.dartdev.outcome }}"
            echo "captures=${{ steps.captures.outcome }}"
            echo "build_debug=${{ steps.build.outcome }}"
            echo "build_profile=${{ steps.profile.outcome }}"
          } > out/checks.txt
          cat out/checks.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checks
          path: out/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: captures-apres
          path: captures-apres/
          if-no-files-found: ignore

  packages:
    # G1 (PIPELINE_GP.md §4) : moteurs indépendants de l'application
    # (packages/, Dart pur). Pour chaque paquet : formatage, analyse sans
    # aucune remarque, tests, et rapport du simulateur s'il existe
    # (`dart run bin/<paquet>_cli.dart --rapport <dossier>`), recopié dans
    # ci-out/packages/<paquet>/. Sans paquet : succès « aucun paquet ».
    name: Paquets Dart (moteurs)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Contrôler chaque paquet
        run: |
          set -o pipefail
          mkdir -p out-packages
          bilan=out-packages/packages.txt
          : > "$bilan"
          status=0
          found=0
          root=$PWD
          for dir in packages/*/; do
            [ -f "${dir}pubspec.yaml" ] || continue
            found=1
            name=$(basename "$dir")
            log="$root/out-packages/$name.log"
            mkdir -p "out-packages/$name"
            echo "== $name" | tee "$log"
            ok=1
            (cd "$dir" && dart pub get) >> "$log" 2>&1 || ok=0
            (cd "$dir" && dart format --output=none --set-exit-if-changed .) >> "$log" 2>&1 || { echo "formatage : échec" >> "$log"; ok=0; }
            (cd "$dir" && dart analyze --fatal-infos) >> "$log" 2>&1 || { echo "analyse : échec" >> "$log"; ok=0; }
            (cd "$dir" && dart test --reporter expanded) >> "$log" 2>&1 || { echo "tests : échec" >> "$log"; ok=0; }
            if [ -f "${dir}bin/${name}_cli.dart" ]; then
              (cd "$dir" && dart run "bin/${name}_cli.dart" --rapport "$root/out-packages/$name") >> "$log" 2>&1 || { echo "rapport : échec" >> "$log"; ok=0; }
            fi
            if [ "$ok" = 1 ]; then echo "$name=success" >> "$bilan"; else echo "$name=failure" >> "$bilan"; status=1; fi
            tail -n 30 "$log"
          done
          if [ "$found" = 0 ]; then echo "aucun paquet" | tee -a "$bilan"; fi
          cat "$bilan"
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: packages
          path: out-packages/
          if-no-files-found: warn

  before:
    name: Rendus de test de référence (main, commit parent du lot)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Projet de main (commit parent du lot)
        run: |
          git fetch -q --depth 1 origin main
          git rev-parse origin/main
          mkdir -p avant
          if git cat-file -e origin/main:streetlift_tracker_v33.zip 2>/dev/null; then
            # main encore livré en ZIP (5.3.1 et avant).
            git show origin/main:streetlift_tracker_v33.zip > main.zip
            unzip -q main.zip -d avant-zip
            cp -a avant-zip/streetlift_tracker/. avant/
          else
            git archive origin/main | tar -x -C avant
          fi
          test -f avant/pubspec.yaml
      - name: Déchiffrer les ressources sous licence de main (M6c, si chiffrées)
        env:
          KT_ASSETS_KEY: ${{ secrets.KT_ASSETS_KEY }}
        run: |
          if [ -f avant/tools/secure_assets.py ]; then
            (cd avant && python3 tools/secure_assets.py decrypt)
          fi
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_BEFORE }}
          channel: stable
          cache: true
      - name: Rendus (avant)
        working-directory: avant
        run: |
          flutter pub get --enforce-lockfile > /dev/null
          touch ../marker
          TZ=Europe/Paris flutter test --no-pub --timeout 300s --dart-define=KALIS_CAPTURE=true \
            test/visual_capture_test.dart test/l5c_ecrans_capture_test.dart > ../captures-avant.log 2>&1 || true
          mkdir -p ../captures-avant
          find . -name '*.png' -newer ../marker -not -path './build/*' | while read -r f; do
            cp "$f" "../captures-avant/$(echo "${f#./}" | tr '/' '_')"
          done
          cp ../captures-avant.log ../captures-avant/
          ls ../captures-avant | wc -l
      - uses: actions/upload-artifact@v4
        with:
          name: captures-avant
          path: captures-avant/

  emulator:
    name: Rendu réel sur émulateur Android (Flutter GPU)
    runs-on: ubuntu-24.04
    # PIPELINE_3D.md §4 : un blocage échoue vite (≈ 13 min en M4b).
    timeout-minutes: 30
    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false
    defaults:
      run:
        shell: bash
    steps:
      - name: Libérer de l'espace disque (image système de l'émulateur)
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost \
            /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/share/powershell \
            /opt/microsoft /usr/local/share/chromium /opt/az /usr/share/miniconda || true
          sdk="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          for d in "$sdk"/ndk/*; do
            [ "$(basename "$d")" = "28.2.13676358" ] || sudo rm -rf "$d"
          done
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          df -h / | tail -1
      - uses: actions/checkout@v4
      - name: Déchiffrer les ressources sous licence (M6c)
        env:
          KT_ASSETS_KEY: ${{ secrets.KT_ASSETS_KEY }}
        run: python3 tools/secure_assets.py decrypt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Installer les composants
        run: |
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          tools="$sdk/cmdline-tools/latest/bin"
          (yes 2>/dev/null || true) | "$tools/sdkmanager" --licenses > /dev/null
          "$tools/sdkmanager" --install "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" > /dev/null
          flutter pub get --enforce-lockfile || flutter pub get
          mkdir -p build/ci3d
          # integration_test hors du pubspec livré (voir docs/CI_3D.md) :
          # ajouté ici seulement, puis analyse du test d'intégration.
          flutter pub add 'dev:integration_test:{"sdk":"flutter"}' > build/ci3d/pub-add.log 2>&1
          flutter analyze --no-pub integration_test test_driver --no-fatal-infos 2>&1 | tee build/ci3d/analyze-integration.log
          grep -q "No issues found" build/ci3d/analyze-integration.log
      - name: Activer KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Précompiler l'APK de test
        run: flutter build apk --debug --no-pub --dart-define=KALIS_DEV=true --target=integration_test/profil_g6_test.dart > build/ci3d/build-test.log 2>&1 || (tail -n 60 build/ci3d/build-test.log; exit 1)
      - name: Rendu sur émulateur
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          # Même émulateur que la CI de flutter_scene (SwANGLE stable).
          emulator-build: 13823996
          emulator-options: -no-window -gpu swangle_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash tools/ci3d_drive.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulateur
          path: build/ci3d/
          if-no-files-found: warn

  publish:
    name: Publier les résultats dans ci-out/
    needs: [checks, packages, before, emulator]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Comparer les rendus et assembler ci-out
        run: |
          rm -rf ci-out && mkdir -p ci-out
          cp -r artifacts/checks/. ci-out/ 2>/dev/null || true
          mkdir -p ci-out/emulateur && cp -r artifacts/emulateur/. ci-out/emulateur/ 2>/dev/null || true
          mkdir -p ci-out/packages && cp -r artifacts/packages/. ci-out/packages/ 2>/dev/null || true
          cp artifacts/captures-avant/captures-avant.log ci-out/ 2>/dev/null || true
          pip install --quiet pillow
          if [ -d artifacts/captures-avant ] && [ -d artifacts/captures-apres ]; then
            python3 tools/compare_renders.py artifacts/captures-avant artifacts/captures-apres > ci-out/captures-comparaison.txt 2>&1 || true
            mkdir -p ci-out/captures
            # Les 16 paires les plus différentes (nombre de pixels décroissant).
            # G3 : aucune paire différente (grep sans résultat) n'est pas un échec.
            { grep -E '^\S+\.png' ci-out/captures-comparaison.txt || true; } | { grep 'pixels différents' || true; } | sort -t$'\t' -k2 -n -r | awk '{print $1}' | head -n 16 | while read -r n; do
              cp "artifacts/captures-avant/$n" "ci-out/captures/avant_$n" 2>/dev/null || true
              cp "artifacts/captures-apres/$n" "ci-out/captures/apres_$n" 2>/dev/null || true
            done
            ls artifacts/captures-apres | head -n 400 > ci-out/captures-liste.txt
          fi
          {
            echo "run=${{ github.run_id }}"
            echo "commit=${{ github.sha }}"
            echo "checks=${{ needs.checks.result }}"
            echo "packages=${{ needs.packages.result }}"
            echo "before=${{ needs.before.result }}"
            echo "emulator=${{ needs.emulator.result }}"
          } > ci-out/resultat.txt
          cat ci-out/resultat.txt
          du -sh ci-out
      - name: Recommiter ci-out sur claude/ci-3d
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Posé sur la tête actuelle de la branche (un run annulé a pu y
          # recommiter ci-out entre-temps) : seul ci-out change, sans rebase
          # ni conflit (M2).
          for i in 1 2 3; do
            git fetch -q origin claude/ci-3d
            git reset -q FETCH_HEAD
            # ci-out/ est ignoré sur main (M4c) : ajout forcé ici seulement.
            git add -A -f ci-out
            git commit -qm "CI 3D : résultats du run ${{ github.run_id }}" || exit 0
            git push -q origin HEAD:claude/ci-3d && break
            sleep 5
          done
