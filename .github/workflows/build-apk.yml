# Build signé de Kalis Track. M4c (5.3.2) : le projet Flutter est à la racine
# du dépôt (plus de ZIP à extraire) ; étapes de contrôle et de signature
# inchangées, la clé vient toujours des secrets GitHub.
name: Build APK et AAB

on:
  push:
    branches: ["**"]
    paths:
      - lib/**
      - assets/**
      - android/**
      - test/**
      - tools/**
      - hook/**
      - integration_test/**
      - test_driver/**
      - pubspec.yaml
      - pubspec.lock
      - analysis_options.yaml
      - .github/workflows/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kalis-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Déchiffrer les ressources sous licence (M6c)
        # Personnage Mixamo et mannequin d'exécution chiffrés dans
        # assets_secure/ ; échec explicite si le secret KT_ASSETS_KEY manque.
        # Les clairs ne sont jamais publiés (artefacts : APK, AAB, contrôles).
        env:
          KT_ASSETS_KEY: ${{ secrets.KT_ASSETS_KEY }}
        run: python3 tools/secure_assets.py decrypt
      - name: Préparer le projet (racine du dépôt)
        run: |
          test -f android/app/build.gradle.kts
          test ! -e streetlift_tracker_v33.zip
          chmod +x android/gradlew
          mkdir -p validation-output
      - name: Contrôler l'arbre du dépôt sans secrets, fichier par fichier
        run: |
          python3 tools/package_release.py --check
          python3 tools/check_release_without_secrets.py --tree
          python3 tools/verify_project.py
          python3 tools/secure_assets.py check
          git ls-files -z | xargs -0 sha256sum > validation-output/inputs.sha256
          git rev-parse HEAD > validation-output/commit.txt
      - name: Installer les composants Android ciblés
        run: |
          # L1b-R1 : SDK préinstallé sur ubuntu-24.04, mais sdkmanager hors du PATH.
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$sdk" && test -d "$sdk"
          tools="$sdk/cmdline-tools/latest/bin"
          test -x "$tools/sdkmanager" && test -x "$tools/apkanalyzer"
          echo "$tools" >> "$GITHUB_PATH"
          (yes 2>/dev/null || true) | "$tools/sdkmanager" --licenses > /dev/null
          "$tools/sdkmanager" --install "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" \
            > validation-output/sdkmanager-install.log 2>&1 \
            || { tail -n 40 validation-output/sdkmanager-install.log; exit 1; }
          test -x "$sdk/build-tools/36.0.0/apksigner" && test -x "$sdk/build-tools/36.0.0/zipalign"
          test -f "$sdk/build-tools/36.0.0/lib/apksigner.jar"
          test -f "$sdk/platforms/android-36/android.jar"
          test -f "$sdk/ndk/28.2.13676358/source.properties"
          flutter --version > validation-output/flutter.txt
          java -version 2> validation-output/java.txt
          "$tools/sdkmanager" --list_installed > validation-output/android-sdk.txt
          python3 tools/download_bundletool.py "$RUNNER_TEMP/bundletool.jar"
      - name: Installer les dépendances verrouillées
        run: flutter pub get --enforce-lockfile
      - name: Contrôler le formatage
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyser le code
        run: flutter analyze --no-pub 2>&1 | tee validation-output/analyze.log
      - name: Exécuter les tests de régression
        run: |
          python3 -m unittest discover -s tools/tests -v 2>&1 | tee validation-output/python-tests.log
          TZ=Europe/Paris flutter test --no-pub --timeout 60s --reporter expanded 2>&1 | tee validation-output/flutter-tests.log
      - name: Générer les icônes
        run: dart run flutter_launcher_icons
      - name: Prouver le refus réel des releases sans secrets valides
        run: python3 tools/check_release_without_secrets.py --output validation-output/without-secrets
      - name: Définir un numéro commun aux deux formats
        run: |
          python3 - <<'PY'
          import os, time
          from pathlib import Path
          # Secondes depuis 2020 : reste croissant si le workflow est renommé.
          code = max(int(time.time()) - 1577836800, 100000 + int(os.environ['GITHUB_RUN_NUMBER']))
          if not 0 < code < 2100000000:
              raise SystemExit('versionCode hors limites Android')
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write(f'BUILD_NUMBER={code}\n')
          Path('validation-output/build-number.txt').write_text(str(code) + '\n')
          PY
      - name: Restaurer et contrôler obligatoirement la clé existante
        env:
          KALIS_KEYSTORE_BASE64: ${{ secrets.KALIS_KEYSTORE_BASE64 }}
          KALIS_KEYSTORE_PASSWORD: ${{ secrets.KALIS_KEYSTORE_PASSWORD }}
        run: |
          python3 tools/signing.py restore
          python3 tools/verify_project.py --signing
      - name: Compiler APK et AAB avec le même numéro
        env:
          KALIS_KEYSTORE_BASE64: ${{ secrets.KALIS_KEYSTORE_BASE64 }}
          KALIS_KEYSTORE_PASSWORD: ${{ secrets.KALIS_KEYSTORE_PASSWORD }}
        run: |
          flutter build apk --release --no-pub --build-number="$BUILD_NUMBER"
          flutter build appbundle --release --no-pub --build-number="$BUILD_NUMBER"
      - name: Vérifier les vrais artefacts et préparer leurs empreintes
        run: |
          python3 tools/verify_android_artifacts.py \
            --apk build/app/outputs/flutter-apk/app-release.apk \
            --aab build/app/outputs/bundle/release/app-release.aab \
            --android-sdk "$ANDROID_HOME" --bundletool "$RUNNER_TEMP/bundletool.jar" \
            --output validation-output --build-number "$BUILD_NUMBER"
          mkdir -p apk-output aab-output
          cp build/app/outputs/flutter-apk/app-release.apk apk-output/kalis-track.apk
          cp build/app/outputs/bundle/release/app-release.aab aab-output/kalis-track.aab
          (cd apk-output && sha256sum kalis-track.apk > kalis-track.apk.sha256)
          (cd aab-output && sha256sum kalis-track.aab > kalis-track.aab.sha256)
      - name: Publier l'APK téléchargeable
        uses: actions/upload-artifact@v4
        with:
          name: kalis-track-apk
          path: apk-output/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Publier l'AAB pour préparer la publication
        uses: actions/upload-artifact@v4
        with:
          name: kalis-track-aab
          path: aab-output/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Conserver les résultats de validation même en cas de refus
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kalis-track-validation
          path: validation-output/
          if-no-files-found: warn
          retention-days: 30
      - name: Nettoyer uniquement la copie de clé du runner éphémère
        if: always()
        run: |
          rm -f signing/kalis_track.p12 signing/.restore-*
          rm -rf assets_secure/clair assets/anatomy/mannequin.glb
