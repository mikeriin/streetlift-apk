name: Build APK
on:
  push:
    branches: ["**"]
  workflow_dispatch:

env:
  KEYSTORE_PASSWORD: ${{ secrets.KALIS_KEYSTORE_PASSWORD || 'kalistrack2026' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Décompresser le projet
        run: unzip -q streetlift_tracker_v33.zip

      - name: Créer le squelette Flutter et injecter les sources
        run: |
          flutter create --org fr.tchoupi --project-name streetlift_tracker build_app
          rm -rf build_app/lib
          cp -r streetlift_tracker/lib build_app/
          cp -r streetlift_tracker/assets build_app/
          cp -r streetlift_tracker/signing build_app/
          cp streetlift_tracker/pubspec.yaml build_app/

      - name: Nom affiché « Kalis Track »
        run: |
          sed -i 's/android:label="streetlift_tracker"/android:label="Kalis Track"/' \
            build_app/android/app/src/main/AndroidManifest.xml

      - name: Notifications (permissions, receivers) + desugaring Java
        run: |
          python3 - << 'EOF'
          import glob, re
          # --- AndroidManifest : permissions + receivers de flutter_local_notifications ---
          mp = 'build_app/android/app/src/main/AndroidManifest.xml'
          m = open(mp).read()
          perms = ('    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n'
                   '    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>\n'
                   '    <uses-permission android:name="android.permission.VIBRATE"/>\n')
          if 'POST_NOTIFICATIONS' not in m:
              m = m.replace('    <application', perms + '    <application', 1)
          receivers = (
              '        <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver" />\n'
              '        <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver">\n'
              '            <intent-filter>\n'
              '                <action android:name="android.intent.action.BOOT_COMPLETED"/>\n'
              '                <action android:name="android.intent.action.MY_PACKAGE_REPLACED"/>\n'
              '                <action android:name="android.intent.action.QUICKBOOT_POWERON"/>\n'
              '                <action android:name="com.htc.intent.action.QUICKBOOT_POWERON"/>\n'
              '            </intent-filter>\n'
              '        </receiver>\n')
          if 'ScheduledNotificationReceiver' not in m:
              m = m.replace('    </application>', receivers + '    </application>', 1)
          open(mp, 'w').write(m)
          # --- Gradle : core library desugaring (requis par flutter_local_notifications) ---
          p = glob.glob('build_app/android/app/build.gradle*')[0]
          s = open(p).read()
          if p.endswith('.kts'):
              s = re.sub(r'(compileOptions\s*\{)', r'\1\n        isCoreLibraryDesugaringEnabled = true', s, count=1)
              s += '\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n'
          else:
              s = re.sub(r'(compileOptions\s*\{)', r'\1\n        coreLibraryDesugaringEnabled true', s, count=1)
              s += "\ndependencies {\n    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'\n}\n"
          open(p, 'w').write(s)
          print('Manifest + desugaring OK')
          EOF

      - name: Signature stable (clé kalis_track.p12) → mises à jour en place
        run: |
          python3 - << 'EOF'
          import glob, os, re
          p = glob.glob('build_app/android/app/build.gradle*')[0]
          s = open(p).read()
          pw = os.environ['KEYSTORE_PASSWORD']
          if p.endswith('.kts'):
              block = """
              signingConfigs {
                  create("release") {
                      storeFile = file("../../signing/kalis_track.p12")
                      storePassword = "__PW__"
                      keyAlias = "kalis"
                      keyPassword = "__PW__"
                      storeType = "PKCS12"
                  }
              }
          """
              s = s.replace('signingConfigs.getByName("debug")', 'signingConfigs.getByName("release")')
          else:
              block = """
              signingConfigs {
                  release {
                      storeFile file("../../signing/kalis_track.p12")
                      storePassword "__PW__"
                      keyAlias "kalis"
                      keyPassword "__PW__"
                      storeType "PKCS12"
                  }
              }
          """
              s = s.replace('signingConfigs.debug', 'signingConfigs.release')
          block = block.replace('__PW__', pw)
          s = re.sub(r'(android\s*\{)', lambda m: m.group(1) + block, s, count=1)
          open(p, 'w').write(s)
          print('Signature release injectée dans', p)
          EOF

      - name: Icônes launcher
        run: |
          cd build_app
          flutter pub get
          dart run flutter_launcher_icons

      - name: Relever le compileSdk des plugins anciens (flutter_displaymode)
        run: |
          set -e
          for f in $(find ~/.pub-cache -path '*flutter_displaymode*' -name 'build.gradle*' 2>/dev/null); do
            sed -i -E 's/compileSdkVersion[[:space:]]+3[0-3]/compileSdkVersion 35/; s/compileSdk[[:space:]]*=?[[:space:]]*3[0-3]/compileSdk 35/' "$f"
            echo "patché : $f"; grep -nE 'compileSdk' "$f" || true
          done

      - name: Build APK release (versionCode = numéro du run)
        run: |
          cd build_app
          flutter build apk --release --build-number=${{ github.run_number }}

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: kalis-track-apk
          path: build_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
          
