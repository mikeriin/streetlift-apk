name: Build APK

on:
  push:
    branches: ["**"]
    paths:
      - streetlift_tracker_v33.zip
      - .github/workflows/build-apk.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kalis-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      KEYSTORE_PASSWORD: ${{ secrets.KALIS_KEYSTORE_PASSWORD || 'kalistrack2026' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: stable
          cache: true
      - name: Extraire le projet complet
        run: |
          unzip -q streetlift_tracker_v33.zip
          test -f streetlift_tracker/android/app/build.gradle.kts
          chmod +x streetlift_tracker/android/gradlew
      - name: Restaurer la même clé depuis un secret (optionnel)
        env:
          KALIS_KEYSTORE_BASE64: ${{ secrets.KALIS_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64, os, pathlib
          key = os.environ.get('KALIS_KEYSTORE_BASE64', '').strip()
          if key:
              pathlib.Path('streetlift_tracker/signing/kalis_track.p12').write_bytes(base64.b64decode(key, validate=True))
          PY
      - name: Vérifier les assets et la clé de signature
        working-directory: streetlift_tracker
        run: python3 tools/verify_project.py --signing
      - name: Installer les dépendances verrouillées
        working-directory: streetlift_tracker
        run: flutter pub get --enforce-lockfile
      - name: Analyser le code
        working-directory: streetlift_tracker
        run: flutter analyze --no-pub
      - name: Exécuter les tests de régression
        working-directory: streetlift_tracker
        run: |
          python3 -m unittest discover -s tools/tests -v
          TZ=Europe/Paris flutter test --no-pub --timeout 60s --reporter expanded
      - name: Générer les icônes
        working-directory: streetlift_tracker
        run: dart run flutter_launcher_icons
      - name: Définir un versionCode croissant
        run: |
          python3 - <<'PY'
          import os, time
          # Secondes depuis 2020 : reste croissant si le workflow est renommé.
          code = max(int(time.time()) - 1577836800, 100000 + int(os.environ['GITHUB_RUN_NUMBER']))
          if not 0 < code < 2100000000:
              raise SystemExit('versionCode hors limites Android')
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write(f'BUILD_NUMBER={code}\n')
          PY
      - name: Compiler l'APK universel signé
        working-directory: streetlift_tracker
        run: flutter build apk --release --no-pub --build-number="$BUILD_NUMBER"
      - name: Vérifier l'APK produit
        run: |
          APK=streetlift_tracker/build/app/outputs/flutter-apk/app-release.apk
          test -s "$APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"
          mkdir -p apk-output
          cp "$APK" apk-output/kalis-track.apk
          cd apk-output
          sha256sum kalis-track.apk > kalis-track.apk.sha256
      - name: Publier l'APK téléchargeable
        uses: actions/upload-artifact@v4
        with:
          name: kalis-track-apk
          path: apk-output/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
