name: Claude CI temporaire (format, analyse, tests)

on:
  push:
    branches: [claude/ci-tools]
    paths: [streetlift_tracker/**, .github/workflows/claude-ci.yml]

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: stable
          cache: true
      - name: Format, analyse, tests (sans secrets)
        working-directory: streetlift_tracker
        run: |
          mkdir -p ../ci-out
          flutter pub get --enforce-lockfile > ../ci-out/pub.log 2>&1 || true
          dart format lib test > ../ci-out/format.log 2>&1 || true
          git diff --stat > ../ci-out/format-diff-stat.txt || true
          git diff > ../ci-out/format.diff || true
          flutter analyze --no-pub > ../ci-out/analyze.log 2>&1; echo "exit=$?" >> ../ci-out/analyze.log
          TZ=Europe/Paris flutter test --no-pub --timeout 60s --reporter expanded > ../ci-out/test.log 2>&1; echo "exit=$?" >> ../ci-out/test.log
          tail -n 5 ../ci-out/test.log
      - name: Renvoyer les résultats sur la branche
        run: |
          git config user.name "claude-ci"
          git config user.email "claude-ci@users.noreply.github.com"
          git add ci-out streetlift_tracker/lib streetlift_tracker/test
          git commit -m "Résultats CI $(date -u +%H:%M:%S)"
          git push origin HEAD:claude/ci-tools
