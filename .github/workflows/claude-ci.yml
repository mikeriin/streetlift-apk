name: Claude CI temporaire (format, analyse, tests)

on:
  push:
    branches: [claude/ci-tools]
    paths: [streetlift_tracker/**, .github/workflows/claude-ci.yml]

permissions:
  contents: write

concurrency:
  group: claude-ci
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: stable
          cache: true
      - name: Format et analyse
        working-directory: streetlift_tracker
        run: |
          mkdir -p ../ci-out
          flutter pub get --enforce-lockfile > ../ci-out/pub.log 2>&1 || true
          dart format lib test > ../ci-out/format.log 2>&1 || true
          git diff > ../ci-out/format.diff || true
          flutter analyze --no-pub > ../ci-out/analyze.log 2>&1; echo "exit=$?" >> ../ci-out/analyze.log
      - name: Publier format/analyse
        if: always()
        run: &push |
          git config user.name "claude-ci"
          git config user.email "claude-ci@users.noreply.github.com"
          git add -A ci-out streetlift_tracker/lib streetlift_tracker/test
          git commit -q -m "Résultats CI ${GITHUB_JOB} $(date -u +%H:%M:%S)" || exit 0
          git pull -q --rebase origin claude/ci-tools || true
          git push -q origin HEAD:claude/ci-tools
      - name: Tests ciblés (L2)
        if: always()
        working-directory: streetlift_tracker
        run: |
          TZ=Europe/Paris timeout 420 flutter test --no-pub --timeout 45s --reporter expanded test/l2_persistence_test.dart test/l2_purchase_ui_test.dart test/store_test.dart test/wod_store_test.dart test/wod_acquisition_test.dart > ../ci-out/test-history.log 2>&1; echo "exit=$?" >> ../ci-out/test-history.log
      - name: Publier tests ciblés
        if: always()
        run: *push
      - name: Suite complète
        if: always()
        working-directory: streetlift_tracker
        run: |
          TZ=Europe/Paris timeout 900 flutter test --no-pub --timeout 45s --reporter expanded > ../ci-out/test.log 2>&1; echo "exit=$?" >> ../ci-out/test.log
      - name: Publier suite complète
        if: always()
        run: *push
