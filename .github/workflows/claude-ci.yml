name: Claude CI temporaire (format, analyse, tests)

on:
  push:
    branches: [claude/ci-tools]
    paths: [streetlift_tracker/**, .github/workflows/claude-ci.yml]

permissions:
  contents: write

concurrency:
  group: claude-ci
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: stable
          cache: true
      - name: Format et analyse
        working-directory: streetlift_tracker
        run: |
          mkdir -p ../ci-out
          flutter pub get --enforce-lockfile > ../ci-out/pub.log 2>&1 || true
          dart format lib test > ../ci-out/format.log 2>&1 || true
          git diff > ../ci-out/format.diff || true
          flutter analyze --no-pub > ../ci-out/analyze.log 2>&1; echo "exit=$?" >> ../ci-out/analyze.log
          dart run tools/wod_catalog_snapshot.dart > ../ci-out/catalog.jsonl 2> ../ci-out/catalog.err || true
      - name: Publier format/analyse
        if: always()
        run: &push |
          git config user.name "claude-ci"
          git config user.email "claude-ci@users.noreply.github.com"
          git add -A ci-out streetlift_tracker/lib streetlift_tracker/test
          git commit -q -m "Résultats CI ${GITHUB_JOB} $(date -u +%H:%M:%S)" || exit 0
          git pull -q --rebase origin claude/ci-tools || true
          git push -q origin HEAD:claude/ci-tools
      - name: Tests ciblés (L3b)
        if: always()
        working-directory: streetlift_tracker
        run: |
          TZ=Europe/Paris timeout 420 flutter test --no-pub --timeout 45s --reporter expanded test/l3b_formats_test.dart test/timers_test.dart test/screens_test.dart test/l3_economy_test.dart test/progression_test.dart test/stats_test.dart test/wod_store_test.dart test/training_estimate_test.dart > ../ci-out/test-history.log 2>&1; echo "exit=$?" >> ../ci-out/test-history.log
      - name: Publier tests ciblés
        if: always()
        run: *push
      - name: Compilation Android debug (code natif) et manifeste fusionné
        if: always()
        working-directory: streetlift_tracker
        run: |
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          tools="$sdk/cmdline-tools/latest/bin"
          (yes 2>/dev/null || true) | "$tools/sdkmanager" --licenses > /dev/null
          "$tools/sdkmanager" --install "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" > /dev/null 2>&1 || true
          chmod +x android/gradlew || true
          timeout 1500 flutter build apk --debug --no-pub --target-platform android-arm64 > ../ci-out/android-debug.log 2>&1; echo "exit=$?" >> ../ci-out/android-debug.log
          find build/app/intermediates -name AndroidManifest.xml | grep -i merged > ../ci-out/manifest-paths.txt || true
          manifest="$(grep -i 'merged_manifest/' ../ci-out/manifest-paths.txt | head -1)"
          if [ -n "$manifest" ]; then cp "$manifest" ../ci-out/merged-manifest-debug.xml; fi
          grep -n -i "allowBackup\|dataExtractionRules\|fullBackupContent\|backupAgent\|hasFragileUserData\|<uses-permission" ../ci-out/merged-manifest-debug.xml > ../ci-out/backup-attributes.txt || echo "aucun attribut de sauvegarde trouvé" > ../ci-out/backup-attributes.txt
          tail -n 5 ../ci-out/android-debug.log
      - name: Publier compilation Android
        if: always()
        run: *push
      - name: Suite complète
        if: always()
        working-directory: streetlift_tracker
        run: |
          TZ=Europe/Paris timeout 900 flutter test --no-pub --timeout 45s --reporter expanded > ../ci-out/test.log 2>&1; echo "exit=$?" >> ../ci-out/test.log
      - name: Publier suite complète
        if: always()
        run: *push
