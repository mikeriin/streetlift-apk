# PR9 : captures d'écran à distance. Un push sur une branche
# `claude/shots-*` lance les tests de capture (polices réelles, rendu du
# moteur de test) listés dans tools/shots.txt, puis pousse les images dans
# shots/ sur la même branche. Sert aux sessions sans SDK Flutter local
# (relecture visuelle de l'interface).
name: Captures d'écran

on:
  push:
    branches: ["claude/shots-*"]

permissions:
  contents: write

concurrency:
  group: kalis-shots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shots:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    # Le commit des images ne relance pas les captures.
    if: ${{ !startsWith(github.event.head_commit.message, 'Captures d') }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Déchiffrer les ressources sous licence
        # Nécessaires à la compilation des tests (mannequin) ; jamais
        # poussées (seul shots/ est ajouté au commit).
        env:
          KT_ASSETS_KEY: ${{ secrets.KT_ASSETS_KEY }}
        run: python3 tools/secure_assets.py decrypt
      - name: Dépendances
        run: flutter pub get --enforce-lockfile
      - name: Contrôles (branche temporaire KB2)
        env:
          TZ: Europe/Paris
        run: |
          mkdir -p shots
          dart format --output=none --set-exit-if-changed lib test integration_test > shots/format.log 2>&1 || true
          flutter analyze --no-pub > shots/analyze.log 2>&1 || true
          flutter test --no-pub --timeout 60s --reporter expanded > shots/tests.log 2>&1 || true
          grep -E -B2 -A30 'EXCEPTION CAUGHT|\[E\]$|Error:' shots/tests.log | head -n 1500 > shots/echecs.log || true
          tail -n 20 shots/tests.log >> shots/echecs.log
          python3 -m unittest discover -s tools/tests > shots/python.log 2>&1 || true
      - name: Pousser les images
        run: |
          git config user.name "kalis-shots"
          git config user.email "kalis-shots@users.noreply.github.com"
          git add -f shots
          if git diff --cached --quiet; then
            echo "Aucune image."
            exit 0
          fi
          git commit -m "Captures d'écran"
          git push
